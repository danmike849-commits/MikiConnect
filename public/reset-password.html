<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — MikiConnect</title><style>body{font-family:system-ui,sans-serif;background:#0b1020;color:#eef2ff;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:520px;width:calc(100% - 40px);padding:28px;background:#151c2f;border:1px solid #29334d;border-radius:16px}input,button{width:100%;padding:12px;margin-top:12px;border-radius:10px;border:1px solid #34405f;background:#0f1526;color:#fff}button{border:0;background:#4f7cff;font-weight:700;cursor:pointer}.error{color:#ff9ca9}.ok{color:#8be28b}</style></head><body><main class="card"><h1>Reset your MikiConnect password</h1><p id="status"></p><input id="password" type="password" autocomplete="new-password" placeholder="New password (8–128 characters)"><input id="confirm" type="password" autocomplete="new-password" placeholder="Confirm new password"><button id="submit">Reset password</button></main><script>const token=new URLSearchParams(location.search).get('token');const s=document.getElementById('status');document.getElementById('submit').onclick=async()=>{const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(!token)return s.textContent='Missing reset token.';if(password!==confirm)return s.textContent='Passwords do not match.';try{const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const d=await r.json().catch(()=>({}));s.textContent=d.message||d.error||'Request failed.';s.className=r.ok?'ok':'error';if(r.ok){document.getElementById('submit').disabled=true;setTimeout(()=>location.href='/',1500)}}catch{ s.textContent='Request failed. Please try again.';s.className='error'}};</script></body></html>
