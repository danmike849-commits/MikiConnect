<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Reset password — MikiConnect</title><style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#0b1020,#111827);color:#eef2ff;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.card{width:min(520px,100%);padding:30px;background:#151c2f;border:1px solid #29334d;border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.logo{text-align:center;font-weight:800;font-size:1.25rem;margin-bottom:22px}h1{margin:0 0 10px;text-align:center}p{line-height:1.5;color:#aeb9ce}.field{margin-top:16px}label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}input{width:100%;padding:12px;border-radius:10px;border:1px solid #34405f;background:#0f1526;color:#fff}button,a{display:block;width:100%;padding:12px;margin-top:16px;border-radius:10px;border:0;background:#4f7cff;color:#fff;text-align:center;text-decoration:none;font-weight:700;cursor:pointer}.status{min-height:24px}.error{color:#ff9ca9}.ok{color:#8be28b}.hint{font-size:.84rem;color:#8f9db6}</style></head><body><main class="card"><div class="logo">MikiConnect</div><h1>Create a new password</h1><p>Choose a new password for your account. Your reset link can only be used once.</p><div class="field"><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="At least 8 characters"><div class="hint">Use at least 8 characters. A longer password is better.</div></div><div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="Enter your password again"></div><p id="status" class="status" aria-live="polite"></p><button id="submit">Reset password</button><a href="/" id="login" style="display:none">Return to login</a></main><script>
const token=new URLSearchParams(location.search).get('token'),s=document.getElementById('status'),btn=document.getElementById('submit');
async function reset(){const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(!token){s.textContent='This reset link is missing or invalid.';s.className='status error';return}if(password.length<8){s.textContent='Your password must be at least 8 characters.';s.className='status error';return}if(password!==confirm){s.textContent='Passwords do not match.';s.className='status error';return}btn.disabled=true;btn.textContent='Resetting…';try{const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:password})});const d=await r.json().catch(()=>({}));s.textContent=r.ok?(d.message||'Password reset successfully. You can now sign in.'):(d.error||'This reset link is invalid or expired.');s.className='status '+(r.ok?'ok':'error');if(r.ok){btn.style.display='none';document.getElementById('login').style.display='block'}}catch{s.textContent='We could not reset your password. Please try again.';s.className='status error';btn.disabled=false;btn.textContent='Reset password'}}
btn.onclick=reset;document.getElementById('confirm').addEventListener('keydown',e=>{if(e.key==='Enter')reset()});
</script></body></html>
