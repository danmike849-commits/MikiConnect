<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0c0c0c; color: #fff; padding: 24px; }
    h1 { color: #0084ff; margin-bottom: 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 30px; }
    .stat-card { background: #181818; padding: 20px; border-radius: 12px; border: 1px solid #282828; }
    .stat-card h3 { color: #888; font-size: 13px; margin-bottom: 6px; }
    .stat-card p { font-size: 24px; font-weight: bold; color: #00e676; }
    .section { background: #181818; border: 1px solid #282828; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #282828; font-size: 14px; }
    .btn { padding: 6px 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
    .btn-ban { background: #ff4444; color: #fff; }
    .btn-unban { background: #00e676; color: #000; }
    .btn-promote { background: #0084ff; color: #fff; }
    .nav-btn { background: #222; color: #fff; border: 1px solid #333; padding: 8px 16px; border-radius: 8px; cursor: pointer; text-decoration: none; }
  </style>
</head>
<body>

  <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1>🛡️ MikiConnect Control Panel</h1>
    <a href="/" class="nav-btn">← Back to Chat</a>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><h3>Total Registered Users</h3><p id="stat-users">0</p></div>
    <div class="stat-card"><h3>Active Sockets</h3><p id="stat-active">0</p></div>
    <div class="stat-card"><h3>Total Messages</h3><p id="stat-messages">0</p></div>
    <div class="stat-card"><h3>Banned Accounts</h3><p id="stat-banned">0</p></div>
  </div>

  <div class="section">
    <h2>User Management</h2>
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="user-table-body"></tbody>
    </table>
  </div>

  <script>
    async function loadAdminData() {
      try {
        const statsRes = await fetch('/api/admin/stats');
        const stats = await statsRes.json();

        document.getElementById('stat-users').innerText = stats.totalUsers || 0;
        document.getElementById('stat-active').innerText = stats.activeSockets || 0;
        document.getElementById('stat-messages').innerText = stats.totalMessages || 0;
        document.getElementById('stat-banned').innerText = stats.bannedUsers || 0;

        const usersRes = await fetch('/api/admin/users');
        const users = await usersRes.json();

        const tbody = document.getElementById('user-table-body');
        tbody.innerHTML = users.map(u => `
          <tr>
            <td><strong>${u.username}</strong></td>
            <td>${u.role}</td>
            <td><span style="color:${u.isBanned ? '#ff4444' : '#00e676'}">${u.isBanned ? 'Banned' : 'Active'}</span></td>
            <td>
              <button class="btn ${u.isBanned ? 'btn-unban' : 'btn-ban'}" onclick="toggleBan('${u.username}', ${!u.isBanned})">
                ${u.isBanned ? 'Unban' : 'Ban'}
              </button>
              ${u.role !== 'admin' ? `<button class="btn btn-promote" style="margin-left:8px;" onclick="promoteAdmin('${u.username}')">Make Admin</button>` : ''}
            </td>
          </tr>
        `).join('');
      } catch(e) {
        console.error('Failed loading admin data:', e);
      }
    }

    async function toggleBan(username, isBanned) {
      await fetch('/api/admin/users/ban', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, isBanned })
      });
      loadAdminData();
    }

    async function promoteAdmin(username) {
      await fetch('/api/admin/users/role', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, role: 'admin' })
      });
      loadAdminData();
    }

    loadAdminData();
  </script>
</body>
</html>
