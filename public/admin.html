<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect Control Panel</title>
  <style>
    body { background-color: #121212; color: #fff; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #333; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
    .stat-box { background: #252525; padding: 15px; border-radius: 6px; text-align: center; }
    .stat-number { font-size: 1.8em; font-weight: bold; color: #007bff; margin-top: 5px; }
    input { width: 70%; padding: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; }
    button { padding: 10px 16px; background: #007bff; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; }
    a { color: #aaa; text-decoration: none; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🛡️ MikiConnect Control Panel</h2>
    <a href="/">← Back to App</a>
  </div>

  <div class="grid">
    <div class="stat-box">
      <div>Total Users</div>
      <div class="stat-number" id="userCount">...</div>
    </div>
    <div class="stat-box">
      <div>System Status</div>
      <div class="stat-number" id="sysStatus" style="color: #28a745;">Active</div>
    </div>
  </div>

  <div class="card">
    <h3>📢 Real-time System Broadcast</h3>
    <p style="color: #aaa; font-size: 0.85em;">Send a live global message to all online users.</p>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <input type="text" id="broadcastMsg" placeholder="Type message here...">
      <button onclick="sendBroadcast()">Send</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/admin/stats');
        const data = await res.json();
        if (data.totalUsers !== undefined) {
          document.getElementById('userCount').innerText = data.totalUsers;
        }
      } catch(e) {
        document.getElementById('userCount').innerText = '1';
      }
    }

    async function sendBroadcast() {
      const msg = document.getElementById('broadcastMsg').value;
      if (!msg) return alert('Enter a message first');

      const res = await fetch('/api/admin/broadcast', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });

      if (res.ok) {
        alert('Broadcast successfully sent!');
        document.getElementById('broadcastMsg').value = '';
      } else {
        alert('Failed to send broadcast');
      }
    }

    loadStats();
  </script>
</body>
</html>
