<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email — MikiConnect</title><style>body{font-family:system-ui,sans-serif;background:#0b1020;color:#eef2ff;display:grid;place-items:center;min-height:100vh;margin:0}.card{max-width:520px;margin:20px;padding:28px;background:#151c2f;border:1px solid #29334d;border-radius:16px;text-align:center}a,button{display:inline-block;margin-top:16px;padding:11px 16px;border-radius:10px;border:0;background:#4f7cff;color:#fff;text-decoration:none;font-weight:700}</style></head><body><main class="card"><h1>MikiConnect</h1><p id="status">Verifying your email…</p><a href="/" id="login" style="display:none">Go to login</a></main><script>const p=new URLSearchParams(location.search),token=p.get('token');fetch('/api/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}).then(async r=>{const d=await r.json().catch(()=>({}));document.getElementById('status').textContent=d.message||d.error||'Verification failed.';if(r.ok)document.getElementById('login').style.display='inline-block'}).catch(()=>document.getElementById('status').textContent='Verification failed. Please request a new verification email.');</script></body></html>
