<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MikiConnect</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    #auth-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0f172a; z-index: 999999; display: flex;
      align-items: center; justify-content: center; padding: 20px;
    }
    .auth-card {
      background: #1e293b; padding: 28px 24px; border-radius: 16px;
      width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6); text-align: center; border: 1px solid #334155;
    }
    .auth-card h2 { font-size: 24px; font-weight: 800; color: #ff2a5f; }
    .auth-card input {
      width: 100%; height: 46px; padding: 0 14px; background: #0f172a;
      color: #fff; border: 1px solid #334155; border-radius: 10px; font-size: 15px; outline: none;
    }
    .auth-card button {
      width: 100%; height: 46px; background: #ff2a5f; color: #fff;
      border: none; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer;
    }

    #app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; background: #000; }

    .top-nav {
      position: absolute; top: 0; left: 0; width: 100%; height: 54px;
      display: flex; align-items: center; justify-content: center; gap: 18px;
      z-index: 100; background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.6);
    }
    .top-nav .tab.active { color: #ffffff; font-weight: 700; font-size: 16px; }

    .view-section { display: none; width: 100%; height: calc(100vh - 56px); position: relative; overflow-y: auto; }
    .view-section.active-view { display: flex; flex-direction: column; }

    .feed-container { width: 100%; height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; }
    .feed-card {
      width: 100%; height: calc(100vh - 106px); scroll-snap-align: start; position: relative;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; padding-bottom: 20px;
      border-bottom: 1px solid #1e293b;
    }

    .side-actions {
      position: absolute; right: 12px; bottom: 30px; display: flex;
      flex-direction: column; align-items: center; gap: 18px; z-index: 90;
    }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .action-icon {
      width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; font-size: 20px;
    }

    .post-info { width: 75%; z-index: 90; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    .post-info .author { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .post-info .caption { font-size: 14px; line-height: 1.4; color: #e2e8f0; }

    .chat-input-bar {
      width: 100%; height: 50px; padding: 6px 12px; background: rgba(15, 23, 42, 0.95);
      display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1); z-index: 95;
    }
    .chat-input-bar input {
      flex: 1; height: 38px; background: #1e293b; border: 1px solid #334155;
      border-radius: 20px; padding: 0 14px; color: #fff; font-size: 14px; outline: none;
    }
    .send-btn {
      width: 38px; height: 38px; border-radius: 50%; background: #ff2a5f;
      border: none; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer;
    }

    .bottom-nav {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 56px;
      background: #000000; border-top: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: space-around; z-index: 101;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #94a3b8; font-size: 10px; font-weight: 600; cursor: pointer; }
    .nav-item.active { color: #ffffff; }

    .create-btn {
      width: 42px; height: 28px; background: #ffffff; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer;
    }
    .create-btn::before { content: ''; position: absolute; left: -3px; width: 14px; height: 100%; background: #25f4ee; border-radius: 6px 0 0 6px; z-index: -1; }
    .create-btn::after { content: ''; position: absolute; right: -3px; width: 14px; height: 100%; background: #fe2c55; border-radius: 0 6px 6px 0; z-index: -1; }
    .create-btn span { color: #000; font-weight: 900; font-size: 20px; line-height: 1; }

    .page-padding { padding: 20px; height: 100%; overflow-y: auto; }
    .page-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; color: #ff2a5f; }
    
    .user-card {
      background: #1e293b; padding: 14px; border-radius: 12px; margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between; cursor: pointer;
      transition: background 0.2s, transform 0.1s; border: 1px solid #334155;
    }
    .dm-badge { background: #ff2a5f; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

    /* FULLSCREEN TIKTOK CAMERA UI */
    #camera-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 99999; display: none; flex-direction: column;
      justify-content: space-between; padding: 20px 16px 30px;
    }
    #camera-screen.active-cam { display: flex; }
    #camera-preview {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
    }
    .cam-overlay { position: relative; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
    .cam-header { display: flex; justify-content: space-between; align-items: center; }
    .sound-badge { background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; backdrop-filter: blur(8px); }
    .cam-tools { position: absolute; right: 0; top: 60px; display: flex; flex-direction: column; gap: 20px; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

    .cam-bottom { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-bottom: 10px; }
    .mode-selector { display: flex; gap: 18px; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.6); }
    .mode-selector span.active-mode { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 2px; }

    .shutter-container { display: flex; align-items: center; justify-content: space-around; width: 100%; }
    .shutter-btn {
      width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff;
      background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .shutter-inner { width: 62px; height: 62px; border-radius: 50%; background: #fe2c55; }

    .text-input-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 20; display: none;
      flex-direction: column; justify-content: center; padding: 20px; gap: 14px;
    }
    .text-input-overlay textarea {
      width: 100%; height: 120px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px; padding: 14px; color: #fff; font-size: 16px; outline: none;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 99999; display: none;
      align-items: flex-end; justify-content: center;
    }
    .modal-overlay.active-modal { display: flex; }
    .modal-card {
      width: 100%; max-width: 500px; background: #1e293b; border-radius: 20px 20px 0 0;
      padding: 20px; display: flex; flex-direction: column; gap: 14px; border-top: 1px solid #334155;
    }
    .modal-card input {
      width: 100%; background: #0f172a; color: #fff;
      border: 1px solid #334155; border-radius: 10px; padding: 12px; outline: none; font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-card">
      <h2>MikiConnect</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button type="button" id="login-btn">Log In / Register</button>
    </div>
  </div>

  <div id="app-container">

    <div class="top-nav" id="top-nav">
      <div class="tab">STEM</div>
      <div class="tab">Explore</div>
      <div class="tab">Following</div>
      <div class="tab active">For You</div>
    </div>

    <div id="feed-view" class="view-section active-view">
      <div class="feed-container" id="feed-posts"></div>
      <div class="chat-input-bar">
        <input type="text" id="chat-msg" placeholder="Type a public message...">
        <button class="send-btn" onclick="sendPublicMessage()">➔</button>
      </div>
    </div>

    <div id="friends-view" class="view-section page-padding">
      <div class="page-title">Registered Users</div>
      <div id="users-list">Loading registered users...</div>
    </div>

    <div id="inbox-view" class="view-section page-padding">
      <div class="page-title">Live Public Feed Chat</div>
      <div id="live-chat-box" style="display:flex; flex-direction:column; gap:10px;"></div>
    </div>

    <div id="profile-view" class="view-section page-padding">
      <div class="page-title">My Profile</div>
      <div class="user-card" style="flex-direction:column; text-align:center; padding:24px;">
        <div style="font-size:48px; margin-bottom:8px;">👤</div>
        <h3 id="profile-username" style="color:#ff2a5f;">@guest</h3>
      </div>
      <button onclick="logoutUser()" style="width:100%; padding:12px; background:#ef4444; color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Log Out</button>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchView('feed-view', this, true)">
        <div class="nav-icon">🏠</div><span>Home</span>
      </div>
      <div class="nav-item" onclick="switchView('friends-view', this, false)">
        <div class="nav-icon">👥</div><span>Friends</span>
      </div>
      <div class="create-btn" onclick="openCamera()"><span>+</span></div>
      <div class="nav-item" onclick="switchView('inbox-view', this, false)">
        <div class="nav-icon">💬</div><span>Inbox</span>
      </div>
      <div class="nav-item" onclick="switchView('profile-view', this, false)">
        <div class="nav-icon">👤</div><span>Profile</span>
      </div>
    </div>

  </div>

  <!-- TIKTOK STYLE CAMERA OVERLAY -->
  <div id="camera-screen">
    <video id="camera-preview" autoplay playsinline muted></video>
    
    <div class="cam-overlay">
      <div class="cam-header">
        <span style="font-size:24px; cursor:pointer;" onclick="closeCamera()">✕</span>
        <div class="sound-badge">🎵 Add sound</div>
        <span style="font-size:20px; cursor:pointer;" onclick="switchCameraFacing()">🔄</span>
      </div>

      <div class="cam-tools">
        <div>⚡</div>
        <div>⏱️</div>
        <div>🖼️</div>
        <div>✨</div>
      </div>

      <div class="cam-bottom">
        <div class="mode-selector">
          <span>10m</span>
          <span>60s</span>
          <span>15s</span>
          <span class="active-mode" onclick="setMode('PHOTO')">PHOTO</span>
          <span onclick="openTextOverlay()">TEXT</span>
        </div>

        <div class="shutter-container">
          <div style="width:40px;"></div>
          <div class="shutter-btn" onclick="triggerCapture()">
            <div class="shutter-inner"></div>
          </div>
          <div style="width:40px; font-size:24px; cursor:pointer;" onclick="openTextOverlay()">✍️</div>
        </div>
      </div>
    </div>

    <div class="text-input-overlay" id="text-overlay">
      <h3 style="color:#fe2c55;">Write Post Caption</h3>
      <textarea id="camera-post-caption" placeholder="What's on your mind?"></textarea>
      <button onclick="publishCameraPost()" style="padding:14px; background:#fe2c55; color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Publish Post</button>
      <button onclick="closeTextOverlay()" style="padding:10px; background:transparent; color:#aaa; border:none; cursor:pointer;">Back to Camera</button>
    </div>
  </div>

  <!-- PRIVATE CHAT MODAL -->
  <div id="dm-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 style="color:#ff2a5f;" id="dm-target-title">Chat with User</h3>
      <div id="dm-chat-history" style="height: 180px; overflow-y: auto; background: #0f172a; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px;"></div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="dm-input" placeholder="Type a private message...">
        <button onclick="sendPrivateMessage()" style="padding:0 16px; background:#ff2a5f; color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">Send</button>
      </div>
      <button onclick="closeModals()" style="padding:10px; background:transparent; color:#94a3b8; border:none; cursor:pointer;">Close</button>
    </div>
  </div>

  <script>
    const socket = io();
    let authToken = localStorage.getItem('token');
    let currentUser = localStorage.getItem('username');
    let activeDmTarget = null;
    let currentStream = null;
    let useFacingUser = true;

    if (authToken && currentUser) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('profile-username').textContent = '@' + currentUser;
      initData();
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) return alert('Enter username and password');

      const res = await fetch('/api/auth/register-or-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);
        authToken = data.token;
        currentUser = data.username;
        document.getElementById('profile-username').textContent = '@' + currentUser;
        document.getElementById('auth-screen').style.display = 'none';
        initData();
      } else {
        alert(data.error || 'Authentication failed');
      }
    });

    function initData() {
      socket.emit('register_user', currentUser);
      fetchPosts();
      fetchUsers();
    }

    // CAMERA FUNCTIONS
    async function openCamera() {
      document.getElementById('camera-screen').classList.add('active-cam');
      startCameraStream();
    }

    async function startCameraStream() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: useFacingUser ? 'user' : 'environment' },
          audio: false
        });
        document.getElementById('camera-preview').srcObject = currentStream;
      } catch (err) {
        console.warn('Camera permission denied or unavailable');
      }
    }

    function switchCameraFacing() {
      useFacingUser = !useFacingUser;
      startCameraStream();
    }

    function closeCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('camera-screen').classList.remove('active-cam');
      closeTextOverlay();
    }

    function openTextOverlay() { document.getElementById('text-overlay').style.display = 'flex'; }
    function closeTextOverlay() { document.getElementById('text-overlay').style.display = 'none'; }

    function triggerCapture() { openTextOverlay(); }

    async function publishCameraPost() {
      const caption = document.getElementById('camera-post-caption').value.trim();
      if (!caption) return alert('Write a caption for your post');

      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + authToken
        },
        body: JSON.stringify({ caption })
      });

      if (res.ok) {
        document.getElementById('camera-post-caption').value = '';
        closeCamera();
        switchView('feed-view', document.querySelectorAll('.bottom-nav .nav-item')[0], true);
      } else {
        alert('Failed to publish post');
      }
    }

    // FEED & POSTS
    async function fetchPosts() {
      const res = await fetch('/api/posts');
      const posts = await res.json();
      const feed = document.getElementById('feed-posts');
      feed.innerHTML = '';
      posts.forEach(p => renderPost(p));
    }

    function renderPost(post) {
      const feed = document.getElementById('feed-posts');
      const card = document.createElement('div');
      card.className = 'feed-card';
      card.innerHTML = `
        <div class="side-actions">
          <div class="action-btn"><div class="action-icon">❤️</div><span class="action-count">${post.likes || 0}</span></div>
          <div class="action-btn"><div class="action-icon">💬</div><span class="action-count">0</span></div>
          <div class="action-btn"><div class="action-icon">🔖</div><span class="action-count">0</span></div>
        </div>
        <div class="post-info">
          <div class="author">@${post.author} <span style="color:#ff2a5f;">✔</span></div>
          <div class="caption">${post.caption}</div>
        </div>
      `;
      feed.prepend(card);
    }

    // USER LIST & DM
    async function fetchUsers() {
      const res = await fetch('/api/users');
      const users = await res.json();
      const container = document.getElementById('users-list');
      
      container.innerHTML = users
        .filter(u => u.username !== currentUser)
        .map(u => `
          <div class="user-card" onclick="openPrivateChat('${u.username}')">
            <div style="display:flex; align-items:center; gap:12px;">
              <span style="font-size:24px;">👤</span>
              <div>
                <strong>@${u.username}</strong><br>
                <small style="color:#94a3b8;">Registered User</small>
              </div>
            </div>
            <span class="dm-badge">Chat 💬</span>
          </div>
        `).join('');
    }

    function openPrivateChat(targetUsername) {
      activeDmTarget = targetUsername;
      document.getElementById('dm-target-title').textContent = 'Chat with @' + targetUsername;
      document.getElementById('dm-chat-history').innerHTML = '';
      document.getElementById('dm-modal').classList.add('active-modal');
    }

    function sendPrivateMessage() {
      const input = document.getElementById('dm-input');
      const msg = input.value.trim();
      if (!msg || !activeDmTarget) return;

      socket.emit('send_private_message', {
        sender: currentUser,
        recipient: activeDmTarget,
        text: msg
      });

      appendDmMessage(currentUser, msg);
      input.value = '';
    }

    function appendDmMessage(sender, text) {
      const box = document.getElementById('dm-chat-history');
      const div = document.createElement('div');
      div.style.padding = '6px 10px';
      div.style.borderRadius = '8px';
      div.style.background = sender === currentUser ? '#ff2a5f' : '#1e293b';
      div.style.alignSelf = sender === currentUser ? 'flex-end' : 'flex-start';
      div.style.maxWidth = '80%';
      div.innerHTML = `<small style="opacity:0.8;">@${sender}:</small><br>${text}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function sendPublicMessage() {
      const input = document.getElementById('chat-msg');
      const msg = input.value.trim();
      if (!msg) return;
      socket.emit('send_message', { user: currentUser, text: msg });
      input.value = '';
    }

    socket.on('receive_private_message', (data) => {
      if (data.sender === activeDmTarget || data.sender === currentUser) {
        appendDmMessage(data.sender, data.text);
      } else {
        alert(`New message from @${data.sender}`);
      }
    });

    socket.on('receive_message', (data) => {
      const box = document.getElementById('live-chat-box');
      const item = document.createElement('div');
      item.className = 'user-card';
      item.innerHTML = `<span>💬</span><div><strong>@${data.user}:</strong> ${data.text}</div>`;
      box.prepend(item);
    });

    socket.on('new_post', (post) => { renderPost(post); });

    function switchView(viewId, element, isHome) {
      document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active-view'));
      document.querySelectorAll('.bottom-nav .nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(viewId).classList.add('active-view');
      if (element) element.classList.add('active');
      document.getElementById('top-nav').style.display = isHome ? 'flex' : 'none';
    }

    function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active-modal')); }
    function logoutUser() { localStorage.clear(); location.reload(); }
  </script>
</body>
</html>
