<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MikiConnect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; background: #000; color: #fff; overflow: hidden; }

    /* Auth Overlay */
    #auth-screen { position: fixed; inset: 0; background: #121212; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    #auth-screen h2 { color: #0084ff; margin-bottom: 20px; font-size: 28px; }
    #auth-screen input { width: 100%; max-width: 300px; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; background: #242526; color: #fff; outline: none; }
    #auth-screen button { width: 100%; max-width: 300px; padding: 12px; border-radius: 8px; border: none; background: #0084ff; color: #fff; font-weight: bold; cursor: pointer; }

    /* Messenger Main Container */
    .app-container { display: flex; width: 100vw; height: 100dvh; }

    /* Inbox List */
    .inbox-panel { width: 100%; max-width: 350px; background: #121212; border-right: 1px solid #2f2f2f; display: flex; flex-direction: column; }
    .inbox-header { padding: 16px; font-size: 22px; font-weight: bold; color: #0084ff; border-bottom: 1px solid #242526; }
    .active-bar { display: flex; gap: 12px; padding: 12px; overflow-x: auto; border-bottom: 1px solid #242526; }
    .avatar-wrap { position: relative; display: flex; flex-direction: column; align-items: center; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #3a3b3c; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .dot { width: 12px; height: 12px; background: #31a24c; border-radius: 50%; position: absolute; bottom: 16px; right: 0; border: 2px solid #121212; }
    .avatar-name { font-size: 11px; margin-top: 4px; color: #b0b3b8; }

    /* Active Chat Panel */
    .chat-panel { flex: 1; display: flex; flex-direction: column; background: #000; }
    .chat-header { padding: 12px 16px; background: #121212; border-bottom: 1px solid #242526; display: flex; align-items: center; gap: 12px; }
    .chat-header h3 { font-size: 16px; }
    .chat-header p { font-size: 12px; color: #31a24c; }

    /* Chat Messages */
    .messages-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 18px; font-size: 15px; word-break: break-word; }
    .msg.sent { align-self: flex-end; background: #0084ff; color: #fff; border-bottom-right-radius: 4px; }
    .msg.received { align-self: flex-start; background: #242526; color: #e4e6eb; border-bottom-left-radius: 4px; }
    .msg img, .msg video { max-width: 100%; border-radius: 12px; margin-top: 6px; }
    .msg audio { max-width: 100%; margin-top: 6px; }
    .sender-tag { font-size: 10px; opacity: 0.7; margin-bottom: 2px; }

    /* Input Bar */
    .input-bar { padding: 12px; background: #121212; border-top: 1px solid #242526; display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: none; border: none; color: #0084ff; font-size: 20px; cursor: pointer; }
    .input-bar input[type="text"] { flex: 1; background: #242526; border: none; padding: 10px 16px; border-radius: 20px; color: #fff; outline: none; }
    .send-btn { background: none; border: none; color: #0084ff; font-weight: bold; cursor: pointer; font-size: 18px; }

    @media (max-width: 600px) { .inbox-panel { display: none; } }
  </style>
</head>
<body>

  <!-- Auth View -->
  <div id="auth-screen">
    <h2>MikiConnect</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button id="login-btn">Continue</button>
  </div>

  <!-- Messenger Workspace -->
  <div class="app-container">
    <aside class="inbox-panel">
      <div class="inbox-header">MikiConnect</div>
      <div class="active-bar" id="active-bar"></div>
    </aside>

    <main class="chat-panel">
      <div class="chat-header">
        <div class="avatar" id="header-avatar">M</div>
        <div>
          <h3>General Chat</h3>
          <p id="chat-status">Active now</p>
        </div>
      </div>

      <div class="messages-area" id="messages-area"></div>

      <div class="input-bar">
        <label class="icon-btn">
          📷 <input type="file" id="media-input" accept="image/*,video/*" hidden>
        </label>
        <button class="icon-btn" id="mic-btn">🎙️</button>
        <input type="text" id="msg-input" placeholder="Aa" autocomplete="off">
        <button class="send-btn" id="send-btn">➤</button>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = localStorage.getItem('username');
    let token = localStorage.getItem('token');

    const authScreen = document.getElementById('auth-screen');
    const loginBtn = document.getElementById('login-btn');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const messagesArea = document.getElementById('messages-area');
    const activeBar = document.getElementById('active-bar');
    const mediaInput = document.getElementById('media-input');
    const micBtn = document.getElementById('mic-btn');
    const chatStatus = document.getElementById('chat-status');

    if (currentUser && token) {
      authScreen.style.display = 'none';
      initMessenger();
    }

    loginBtn.addEventListener('click', async () => {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if (!u || !p) return alert('Fill all fields');

      const res = await fetch('/api/auth/register-or-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (data.error) return alert(data.error);

      localStorage.setItem('username', data.username);
      localStorage.setItem('token', data.token);
      currentUser = data.username;
      authScreen.style.display = 'none';
      initMessenger();
    });

    function initMessenger() {
      socket.emit('join', currentUser);

      // Load History
      fetch('/api/messages')
        .then(res => res.json())
        .then(msgs => {
          msgs.forEach(appendMessage);
          messagesArea.scrollTop = messagesArea.scrollHeight;
        });
    }

    function appendMessage(msg) {
      const div = document.createElement('div');
      const isSent = msg.sender === currentUser;
      div.className = `msg ${isSent ? 'sent' : 'received'}`;

      if (!isSent) {
        const tag = document.createElement('div');
        tag.className = 'sender-tag';
        tag.innerText = msg.sender;
        div.appendChild(tag);
      }

      if (msg.text) {
        const txt = document.createElement('div');
        txt.innerText = msg.text;
        div.appendChild(txt);
      }

      if (msg.mediaUrl) {
        if (msg.mediaType === 'audio') {
          const aud = document.createElement('audio');
          aud.src = msg.mediaUrl;
          aud.controls = true;
          div.appendChild(aud);
        } else {
          const img = document.createElement('img');
          img.src = msg.mediaUrl;
          div.appendChild(img);
        }
      }

      messagesArea.appendChild(div);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // Actions
    sendBtn.addEventListener('click', sendText);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendText(); });

    function sendText() {
      const text = msgInput.value.trim();
      if (!text) return;
      socket.emit('sendMessage', { sender: currentUser, text });
      msgInput.value = '';
      socket.emit('typing', false);
    }

    // Sockets
    socket.on('receiveMessage', appendMessage);

    socket.on('onlineUsersList', (users) => {
      activeBar.innerHTML = users.map(u => `
        <div class="avatar-wrap">
          <div class="avatar">${u[0].toUpperCase()}</div>
          <div class="dot"></div>
          <div class="avatar-name">${u}</div>
        </div>
      `).join('');
    });

    msgInput.addEventListener('input', () => {
      socket.emit('typing', msgInput.value.length > 0);
    });

    let timeout;
    socket.on('userTyping', ({ username, isTyping }) => {
      if (isTyping) {
        chatStatus.innerText = `${username} is typing...`;
        clearTimeout(timeout);
        timeout = setTimeout(() => { chatStatus.innerText = 'Active now'; }, 3000);
      } else {
        chatStatus.innerText = 'Active now';
      }
    });

    // Upload Media
    mediaInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append('media', file);
      const res = await fetch('/api/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.url) {
        const type = file.type.startsWith('audio') ? 'audio' : 'image';
        socket.emit('sendMessage', { sender: currentUser, mediaUrl: data.url, mediaType: type });
      }
    });

    // Voice Notes
    let recorder, chunks = [];
    micBtn.addEventListener('click', async () => {
      if (!recorder || recorder.state === 'inactive') {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recorder = new MediaRecorder(stream);
        chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = async () => {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const formData = new FormData();
          formData.append('media', blob, 'voice.webm');
          const res = await fetch('/api/upload', { method: 'POST', body: formData });
          const data = await res.json();
          if (data.url) {
            socket.emit('sendMessage', { sender: currentUser, mediaUrl: data.url, mediaType: 'audio' });
          }
        };
        recorder.start();
        micBtn.style.color = 'red';
      } else {
        recorder.stop();
        micBtn.style.color = '#0084ff';
      }
    });
  </script>
</body>
</html>
