<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; color: #fff; font-family: sans-serif; }
    
    /* Login Screen Overlay */
    #auth-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0f172a; z-index: 99999;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-card {
      background: #1e293b; padding: 24px; border-radius: 12px;
      width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center;
    }
    .auth-card input {
      width: 100%; height: 44px; padding: 10px; background: #334155;
      color: #fff; border: 1px solid #475569; border-radius: 8px; font-size: 16px;
    }
    .auth-card button {
      width: 100%; height: 44px; background: #22c55e; color: #fff;
      border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;
    }

    /* Main App Layout */
    #app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
    .header-bar { height: 50px; background: #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .room-bar { height: 40px; background: #334155; display: flex; align-items: center; padding: 0 12px; }
    .messages-container { flex: 1; overflow-y: auto; padding: 12px; }
    .input-bar { height: 60px; background: #1e293b; display: flex; align-items: center; padding: 8px; gap: 8px; }
    .input-bar input { flex: 1; height: 40px; padding: 0 12px; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 20px; }
  </style>
</head>
<body>

  <!-- Fullscreen Login Modal -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>MikiConnect</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button type="button" id="login-btn">Log In / Sign Up</button>
    </div>
  </div>

  <!-- Main Chat Application Structure -->
  <div id="app-container">
    <div class="header-bar">
      <h3>MikiConnect</h3>
    </div>
    <div class="room-bar">
      <span>Global Room</span>
    </div>
    <div class="messages-container" id="messages">
      <!-- Messages load here -->
    </div>
    <div class="input-bar">
      <input type="text" placeholder="Type a message...">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</body>
</html>
