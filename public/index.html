<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MikiConnect</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { height: 100%; width: 100%; background-color: #000; color: #fff; overflow: hidden; position: fixed; }

    #auth-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .auth-box { background: #111; padding: 24px; border-radius: 12px; width: 90%; max-width: 360px; border: 1px solid #222; text-align: center; }
    .auth-box h2 { color: #0084ff; margin-bottom: 16px; }
    .auth-box input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; outline: none; }
    .auth-box button { width: 100%; padding: 12px; background: #0084ff; border: none; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; }

    .app-container { display: flex; width: 100vw; height: 100dvh; overflow: hidden; }
    .sidebar { width: 320px; border-right: 1px solid #222; display: flex; flex-direction: column; background: #000; height: 100%; }
    .sidebar-header { padding: 16px; font-size: 20px; font-weight: bold; border-bottom: 1px solid #222; color: #0084ff; display: flex; justify-content: space-between; align-items: center; }
    
    .active-users-bar { display: flex; gap: 12px; padding: 12px 16px; overflow-x: auto; border-bottom: 1px solid #111; }
    .user-avatar-wrap { position: relative; display: flex; flex-direction: column; align-items: center; font-size: 11px; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: #0084ff; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .online-indicator { position: absolute; bottom: 14px; right: 0; width: 12px; height: 12px; background: #00e676; border-radius: 50%; border: 2px solid #000; }

    .chat-window { flex: 1; display: flex; flex-direction: column; background: #000; height: 100dvh; position: relative; overflow: hidden; }
    .chat-header { height: 60px; min-height: 60px; padding: 0 16px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 12px; background: #000; }
    .messages-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #000; }
    
    .message { max-width: 75%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; position: relative; }
    .message.received { background: #222; align-self: flex-start; border-bottom-left-radius: 4px; }
    .message.sent { background: #0084ff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .message img, .message video, .message audio { max-width: 100%; border-radius: 12px; margin-top: 6px; display: block; }
    .sender-name { font-size: 11px; opacity: 0.6; margin-bottom: 2px; }
    .msg-actions { font-size: 11px; margin-top: 6px; opacity: 0.8; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 4px; }
    .msg-actions span { cursor: pointer; text-decoration: underline; }

    .input-bar { height: 65px; min-height: 65px; padding: 10px 12px; border-top: 1px solid #222; display: flex; gap: 8px; align-items: center; background: #000; z-index: 10; }
    .input-bar input[type="text"] { flex: 1; background: #181818; border: none; padding: 10px 16px; border-radius: 20px; color: #fff; font-size: 15px; outline: none; }
    .btn-icon { background: none; border: none; color: #0084ff; font-size: 20px; cursor: pointer; padding: 0 4px; display: flex; align-items: center; justify-content: center; }
    .send-btn { background: #0084ff; border: none; color: #fff; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    #typing-status { font-size: 12px; color: #888; padding: 0 16px; min-height: 16px; background: #000; }

    @media (max-width: 768px) {
      .sidebar { width: 100%; }
      .chat-window { width: 100%; display: none; }
      .app-container.active-chat .sidebar { display: none; }
      .app-container.active-chat .chat-window { display: flex; }
    }
  </style>
</head>
<body>

  <!-- CALL MODAL -->
  <div id="call-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:1000; flex-direction:column; align-items:center; justify-content:center;">
    <h3 id="call-status" style="margin-bottom:20px; color:#fff;">Calling...</h3>
    <div style="display:flex; gap:10px; position:relative; width:90%; max-width:500px; height:300px; background:#111; border-radius:12px; overflow:hidden;">
      <video id="remote-video" autoplay playsinline style="width:100%; height:100%; object-fit:cover;"></video>
      <video id="local-video" autoplay playsinline muted style="width:100px; height:140px; object-fit:cover; position:absolute; bottom:10px; right:10px; border-radius:8px; border:2px solid #0084ff;"></video>
    </div>
    <div style="margin-top:20px; display:flex; gap:15px;">
      <button id="accept-call-btn" style="display:none; background:#00e676; border:none; color:#fff; padding:12px 24px; border-radius:20px; font-weight:bold; cursor:pointer;" onclick="acceptCall()">Answer</button>
      <button style="background:#ff4444; border:none; color:#fff; padding:12px 24px; border-radius:20px; font-weight:bold; cursor:pointer;" onclick="endCall()">End Call</button>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div id="auth-modal">
    <div class="auth-box">
      <h2>MikiConnect</h2>
      <input type="text" id="auth-username" placeholder="Username">
      <input type="password" id="auth-password" placeholder="Password">
      <button onclick="handleAuth()">Login / Register</button>
    </div>
  </div>

  <!-- MAIN CHAT APP -->
  <div class="app-container" id="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>MikiConnect</span>
        <button onclick="logout()" style="background:none; border:none; color:#ff4444; font-size:12px; cursor:pointer;">Logout</button>
      </div>
      <div class="active-users-bar" id="active-users"></div>
      
      <div class="chat-list">
        <div class="chat-item" style="padding:16px; cursor:pointer; border-bottom:1px solid #111; display:flex; align-items:center;" onclick="openChat('General Chat')">
          <div class="avatar">G</div>
          <div style="margin-left: 12px;">
            <strong>General Chat</strong>
            <p style="font-size: 12px; color: #888;">Tap to open messaging</p>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-window">
      <div class="chat-header">
        <button onclick="closeChat()" style="background:none; border:none; color:#0084ff; font-size:16px; cursor:pointer;" id="back-btn">← Back</button>
        <strong id="chat-title">General Chat</strong>
        <div style="margin-left:auto; display:flex; gap:12px;">
          <button onclick="startCall(false)" style="background:none; border:none; font-size:20px; cursor:pointer;">📞</button>
          <button onclick="startCall(true)" style="background:none; border:none; font-size:20px; cursor:pointer;">📹</button>
        </div>
      </div>

      <div class="messages-container" id="messages"></div>
      <div id="typing-status"></div>

      <div class="input-bar">
        <label for="media-file" class="btn-icon">📁</label>
        <input type="file" id="media-file" accept="image/*,video/*,audio/*" style="display:none;" onchange="uploadMedia()">
        <button class="btn-icon" id="record-btn" onclick="toggleVoiceRecord()">🎙️</button>
        <input type="text" id="msg-input" placeholder="Aa" oninput="emitTyping()" onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let socket;
    let currentUser = localStorage.getItem('username');
    let token = localStorage.getItem('token');
    let mediaRecorder;
    let audioChunks = [];
    let peerConnection;
    let localStream;
    let callTargetUser = '';

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    if (token && currentUser) {
      document.getElementById('auth-modal').style.display = 'none';
      initApp();
    }

    async function handleAuth() {
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      if (!username || !password) return alert('Enter credentials');

      const res = await fetch('/api/auth/register-or-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.username) {
        localStorage.setItem('token', data.token || 'demo-token');
        localStorage.setItem('username', data.username);
        currentUser = data.username;
        document.getElementById('auth-modal').style.display = 'none';
        initApp();
      } else {
        alert(data.error || 'Authentication failed');
      }
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }

    function initApp() {
      socket = io();
      socket.emit('user_connected', currentUser);
      initCallSocketListeners();

      socket.on('active_users', (users) => {
        const container = document.getElementById('active-users');
        container.innerHTML = users.map(u => `
          <div class="user-avatar-wrap">
            <div class="avatar">${u[0].toUpperCase()}</div>
            <div class="online-indicator"></div>
            <span>${u}</span>
          </div>
        `).join('');
      });

      fetch('/api/messages')
        .then(res => res.json())
        .then(messages => {
          document.getElementById('messages').innerHTML = '';
          messages.forEach(appendMessage);
          scrollToBottom();
        });

      socket.on('chat message', (msg) => {
        appendMessage(msg);
        scrollToBottom();
      });

      socket.on('user_typing', (data) => {
        const el = document.getElementById('typing-status');
        el.innerText = `${data.username} is typing...`;
        setTimeout(() => { el.innerText = ''; }, 3000);
      });

      socket.on('message_edited', (msg) => {
        const el = document.getElementById(`msg-${msg._id}`);
        if (el) {
          const txt = el.querySelector('.msg-text');
          if (txt) txt.innerText = `${msg.text} (edited)`;
        }
      });

      socket.on('message_deleted', (id) => {
        const el = document.getElementById(`msg-${id}`);
        if (el) el.remove();
      });
    }

    function appendMessage(msg) {
      const isSent = msg.sender === currentUser;
      const div = document.createElement('div');
      div.id = `msg-${msg._id}`;
      div.className = `message ${isSent ? 'sent' : 'received'}`;
      
      let html = `<div class="sender-name">${msg.sender}</div>`;
      if (msg.text) html += `<div class="msg-text">${msg.text} ${msg.isEdited ? '(edited)' : ''}</div>`;
      if (msg.mediaUrl) {
        if (msg.mediaType === 'video') html += `<video src="${msg.mediaUrl}" controls></video>`;
        else if (msg.mediaType === 'audio') html += `<audio src="${msg.mediaUrl}" controls></audio>`;
        else html += `<img src="${msg.mediaUrl}" />`;
      }

      if (isSent) {
        html += `<div class="msg-actions">
          <span onclick="editMessage('${msg._id}')">Edit</span>
          <span onclick="deleteMessage('${msg._id}')">Delete</span>
        </div>`;
      }

      div.innerHTML = html;
      document.getElementById('messages').appendChild(div);
    }

    function emitTyping() {
      if (socket) socket.emit('typing', { username: currentUser });
    }

    async function uploadMedia() {
      const fileInput = document.getElementById('media-file');
      if (!fileInput.files[0]) return;

      const formData = new FormData();
      formData.append('media', fileInput.files[0]);

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();

        if (data.url) {
          const mime = fileInput.files[0].type;
          let type = 'image';
          if (mime.startsWith('video')) type = 'video';
          if (mime.startsWith('audio')) type = 'audio';

          socket.emit('chat message', { sender: currentUser, mediaUrl: data.url, mediaType: type });
          fileInput.value = '';
        } else {
          alert('Upload failed');
        }
      } catch (err) {
        alert('File upload error');
      }
    }

    async function toggleVoiceRecord() {
      const btn = document.getElementById('record-btn');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return alert('Audio recording is not supported or permission denied on this browser.');
      }

      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
            const formData = new FormData();
            formData.append('media', audioBlob, 'voicenote.mp3');
            
            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.url) {
              socket.emit('chat message', { sender: currentUser, mediaUrl: data.url, mediaType: 'audio' });
            }
          };
          mediaRecorder.start();
          btn.style.color = '#ff4444';
        } catch (err) {
          alert('Microphone access denied or unavailable.');
        }
      } else {
        mediaRecorder.stop();
        btn.style.color = '#0084ff';
      }
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat message', { sender: currentUser, text });
      input.value = '';
    }

    async function editMessage(id) {
      const newText = prompt('Edit your message:');
      if (!newText) return;
      await fetch(`/api/messages/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: newText })
      });
    }

    async function deleteMessage(id) {
      if (!confirm('Delete this message?')) return;
      await fetch(`/api/messages/${id}`, { method: 'DELETE' });
    }

    async function startCall(isVideo) {
      callTargetUser = document.getElementById('chat-title').innerText.trim();
      if (!callTargetUser || callTargetUser === 'General Chat') {
        callTargetUser = prompt('Enter username to call:');
      }
      if (!callTargetUser) return;

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return alert('Camera/Mic not accessible. Ensure HTTPS is enabled.');
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
        document.getElementById('call-modal').style.display = 'flex';
        document.getElementById('call-status').innerText = `Calling ${callTargetUser}...`;
        document.getElementById('local-video').srcObject = localStream;

        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = e => {
          document.getElementById('remote-video').srcObject = e.streams[0];
        };

        peerConnection.onicecandidate = e => {
          if (e.candidate) {
            socket.emit('call_user', { userToCall: callTargetUser, signalData: peerConnection.localDescription, from: currentUser, isVideo });
          }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
      } catch (err) {
        alert('Could not access camera or microphone.');
      }
    }

    function initCallSocketListeners() {
      socket.on('incoming_call', async (data) => {
        callTargetUser = data.from;
        document.getElementById('call-modal').style.display = 'flex';
        document.getElementById('call-status').innerText = `Incoming ${data.isVideo ? 'Video' : 'Voice'} Call from ${data.from}`;
        document.getElementById('accept-call-btn').style.display = 'block';

        window.incomingSignal = data.signal;
        window.incomingIsVideo = data.isVideo;
      });

      socket.on('call_accepted', async (signal) => {
        document.getElementById('call-status').innerText = 'Connected';
        await peerConnection.setRemoteDescription(new RTCSessionDescription(signal));
      });

      socket.on('call_ended', () => {
        cleanupCall();
      });
    }

    async function acceptCall() {
      document.getElementById('accept-call-btn').style.display = 'none';
      document.getElementById('call-status').innerText = 'Connected';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: window.incomingIsVideo, audio: true });
        document.getElementById('local-video').srcObject = localStream;

        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = e => {
          document.getElementById('remote-video').srcObject = e.streams[0];
        };

        peerConnection.onicecandidate = e => {
          if (e.candidate) {
            socket.emit('answer_call', { to: callTargetUser, signal: peerConnection.localDescription });
          }
        };

        await peerConnection.setRemoteDescription(new RTCSessionDescription(window.incomingSignal));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
      } catch (err) {
        alert('Could not open device media for answering call.');
      }
    }

    function endCall() {
      socket.emit('end_call', { to: callTargetUser });
      cleanupCall();
    }

    function cleanupCall() {
      if (peerConnection) peerConnection.close();
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      document.getElementById('call-modal').style.display = 'none';
    }

    function scrollToBottom() {
      const container = document.getElementById('messages');
      container.scrollTop = container.scrollHeight;
    }

    function openChat(title) {
      document.getElementById('chat-title').innerText = title;
      document.getElementById('app').classList.add('active-chat');
    }

    function closeChat() {
      document.getElementById('app').classList.remove('active-chat');
    }
  </script>
</body>
</html>
