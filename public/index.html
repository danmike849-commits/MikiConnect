cat << 'EOF' > public/index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect</title>
  <link rel="stylesheet" href="style.css">

  <style id="strict-nav-hide-style">
    body.logged-out .nav-tabs,
    body.logged-out nav,
    body.logged-out .navbar,
    body.logged-out .tabs-header,
    body.logged-out div[class*="nav"] {
      display: none !important;
    }
  </style>
</head>
<body class="logged-out">

  <!-- Light Blue In-App Pop-up Banner -->
  <div id="in-app-alert" class="in-app-alert hidden" onclick="openAlertMessage()">
    <div class="alert-avatar">💬</div>
    <div class="alert-content">
      <strong id="alert-sender">Sender Name</strong>
      <p id="alert-preview">Message snippet preview...</p>
    </div>
  </div>

  <!-- Instant Loading Screen Overlay -->
  <div id="app-loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 9999; color: #38bdf8; font-family: sans-serif; transition: opacity 0.3s ease;">
    <h2>Loading MikiConnect...</h2>
  </div>

  <!-- NAVIGATION HEADER (Hidden when logged out) -->
  <nav class="navbar nav-tabs">
    <div class="nav-title">MikiConnect</div>
    <div class="nav-links">
      <a href="#" class="active">Chats</a>
      <a href="#">Feed</a>
      <a href="#">Profile</a>
    </div>
  </nav>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="main-container" style="padding: 20px;">

    <!-- LOGIN CARD CONTAINER -->
    <div class="card" id="auth-card" style="max-width: 400px; margin: 40px auto; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
      <h2 style="color: white; text-align: center; margin-bottom: 20px;">Welcome to MikiConnect</h2>
      
      <form id="login-form" onsubmit="handleLogin(event)">
        <input type="text" id="username" placeholder="Username or Email" required style="width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box;">
        <input type="password" id="password" placeholder="Password" required style="width: 100%; padding: 12px; margin-bottom: 18px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box;">
        
        <button type="submit" style="width: 100%; padding: 12px; background: #22c55e; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px;">
          Log In
        </button>
      </form>

      <!-- WHATSAPP DEVELOPER LINK INSIDE CARD -->
      <div style="text-align: center; margin-top: 18px;">
        <a href="https://wa.me/2349130372258?text=Hello%20Developer" target="_blank" style="color: #25D366; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 6px;">
          💬 Contact Developer on WhatsApp
        </a>
      </div>
    </div>

    <!-- LOGGED IN USER PROFILE CARD -->
    <div id="user-profile-card" style="display:none; max-width: 400px; margin: 20px auto; text-align: center; background: #1e293b; padding: 20px; border-radius: 12px;">
      <div style="width:80px; height:80px; margin:0 auto 10px; border-radius: 50%; background: #38bdf8; display: flex; align-items: center; justify-content: center; font-size: 32px;">👤</div>
      <h3 id="user-display-name" style="margin:5px 0; color: white;">User Profile</h3>
      <p style="color:#8b949e; font-size:13px; margin-bottom: 15px;">Connected to MikiConnect</p>
      <button onclick="logoutUser()" style="background:#ef4444; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">Log Out</button>
    </div>

  </main>

  <!-- APP SCRIPTS -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const loader = document.getElementById('app-loader');
      if (loader) {
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 300);
      }
    });
  </script>
</body>
</html>
EOF
