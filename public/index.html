<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }
    
    header { background-color: #161b22; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
    header h1 { font-size: 1.1rem; color: #2ea44f; display: flex; align-items: center; gap: 8px; }
    .header-btns { display: flex; gap: 8px; }
    .btn-action { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .btn-admin { background: #d97706; color: #fff; border: none; font-weight: bold; display: none; }
    
    /* Dedicated Chat Header Bar */
    .chat-header { background: #161b22; padding: 8px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #30363d; }
    .chat-header .avatar { width: 36px; height: 36px; background: #1f6feb; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .chat-header .user-info { display: flex; flex-direction: column; }
    .chat-header .username { font-size: 0.95rem; font-weight: bold; color: #fff; }
    .chat-header .status { font-size: 0.75rem; color: #8b949e; }
    .chat-header .status.online { color: #2ea44f; }

    .room-bar { display: flex; gap: 8px; overflow-x: auto; padding: 8px 12px; background-color: #0d1117; border-bottom: 1px solid #30363d; }
    .room-tab { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 6px 12px; border-radius: 18px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
    .room-tab.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
    
    .badge { background-color: #2ea44f; color: white; font-size: 0.7rem; font-weight: bold; padding: 2px 6px; border-radius: 10px; display: none; }
    .badge.show { display: inline-block; }

    #chat-box { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .message { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; position: relative; }
    .message.received { background: #21262d; align-self: flex-start; border-bottom-left-radius: 2px; }
    .message.sent { background: #0b84ff; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    
    .quoted-box { background: rgba(0, 0, 0, 0.25); border-left: 3px solid #2ea44f; padding: 4px 8px; border-radius: 4px; margin-bottom: 4px; font-size: 0.8rem; opacity: 0.9; }
    .message .time-container { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; }
    .message .time { font-size: 0.65rem; opacity: 0.75; }
    .message .ticks { font-size: 0.75rem; font-weight: bold; }
    .message .ticks.read { color: #58a6ff; }
    .message .ticks.unread { color: #8b949e; }

    /* Reply Banner */
    #reply-banner { background: #161b22; padding: 6px 12px; border-top: 1px solid #30363d; display: none; justify-content: space-between; align-items: center; font-size: 0.8rem; }
    #reply-banner button { background: none; border: none; color: #da3633; cursor: pointer; font-size: 1rem; }

    footer { padding: 10px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 10px 14px; border-radius: 20px; outline: none; }
    button.send-btn { background: #0b84ff; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    #auth-screen { position: fixed; inset: 0; background: #0d1117; display: flex; justify-content: center; align-items: center; z-index: 100; }
    .auth-card { background: #161b22; padding: 24px; border-radius: 12px; border: 1px solid #30363d; width: 90%; max-width: 360px; text-align: center; }
    .auth-card input { width: 100%; margin-bottom: 12px; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; }
    .auth-card button { width: 100%; padding: 10px; background: #2ea44f; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-card">
      <h2 style="margin-bottom: 16px; color: #fff;">MikiConnect</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()">Log In / Sign Up</button>
    </div>
  </div>

  <header>
    <h1>❤️ MIKICONNECT</h1>
    <div class="header-btns">
      <button class="btn-action btn-admin" id="admin-btn" onclick="toggleAdminPanel()">⚡ Dashboard</button>
      <button class="btn-action" onclick="logout()">Log Out</button>
    </div>
  </header>

  <div class="room-bar" id="room-bar">
    <div class="room-tab active" onclick="switchRoom('Global')" id="tab-Global">
      🌐 Global Room <span class="badge" id="badge-Global">0</span>
    </div>
  </div>

  <div class="chat-header" id="chat-header">
    <div class="avatar" id="header-avatar">G</div>
    <div class="user-info">
      <div class="username" id="header-title">Global Room</div>
      <div class="status" id="header-status">Visible to everyone online</div>
    </div>
  </div>

  <div id="chat-box"></div>

  <div id="reply-banner">
    <div>Replying to: <strong id="reply-user"></strong> - <span id="reply-text"></span></div>
    <button onclick="cancelReply()">✕</button>
  </div>

  <footer>
    <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </footer>

  <script>
    const socket = io();
    let currentUser = '';
    let isUserAdmin = false;
    let activeRoom = 'Global';
    let replyTarget = null;
    let usersList = [];
    const unreadCounts = {};

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) return alert('Enter username and password');

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        currentUser = data.username;
        isUserAdmin = data.isAdmin;
        document.getElementById('auth-screen').style.display = 'none';
        
        if (isUserAdmin) document.getElementById('admin-btn').style.display = 'inline-block';

        socket.emit('register_user', currentUser);
        loadUsers();
        loadMessages();
      } else {
        alert(data.message || 'Login failed');
      }
    }

    function logout() { location.reload(); }

    async function loadUsers() {
      const res = await fetch('/api/users');
      const data = await res.json();
      if (!data.success) return;

      usersList = data.users;
      const roomBar = document.getElementById('room-bar');
      roomBar.innerHTML = `
        <div class="room-tab ${activeRoom === 'Global' ? 'active' : ''}" onclick="switchRoom('Global')" id="tab-Global">
          🌐 Global <span class="badge ${unreadCounts['Global'] ? 'show' : ''}" id="badge-Global">${unreadCounts['Global'] || 0}</span>
        </div>
      `;

      usersList.forEach(u => {
        if (u.username !== currentUser) {
          const tab = document.createElement('div');
          tab.className = `room-tab ${activeRoom === u.username ? 'active' : ''}`;
          tab.id = `tab-${u.username}`;
          tab.onclick = () => switchRoom(u.username);
          tab.innerHTML = `👤 ${u.username} <span class="badge ${unreadCounts[u.username] ? 'show' : ''}" id="badge-${u.username}">${unreadCounts[u.username] || 0}</span>`;
          roomBar.appendChild(tab);
        }
      });

      updateHeaderStatus();
    }

    function updateHeaderStatus() {
      if (activeRoom === 'Global') {
        document.getElementById('header-avatar').innerText = '🌐';
        document.getElementById('header-title').innerText = 'Global Public Chat';
        document.getElementById('header-status').className = 'status';
        document.getElementById('header-status').innerText = 'Visible to everyone online';
      } else {
        const u = usersList.find(x => x.username === activeRoom);
        document.getElementById('header-avatar').innerText = activeRoom[0].toUpperCase();
        document.getElementById('header-title').innerText = activeRoom;
        
        const statusEl = document.getElementById('header-status');
        if (u && u.isOnline) {
          statusEl.className = 'status online';
          statusEl.innerText = 'online';
        } else if (u && u.lastSeen) {
          statusEl.className = 'status';
          const time = new Date(u.lastSeen).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          statusEl.innerText = `last seen today at ${time}`;
        } else {
          statusEl.className = 'status';
          statusEl.innerText = 'offline';
        }
      }
    }

    function switchRoom(room) {
      activeRoom = room;
      unreadCounts[room] = 0;
      updateBadges();
      
      document.querySelectorAll('.room-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById(`tab-${room}`);
      if (activeTab) activeTab.classList.add('active');
      
      updateHeaderStatus();
      loadMessages();
    }

    function updateBadges() {
      Object.keys(unreadCounts).forEach(room => {
        const badgeEl = document.getElementById(`badge-${room}`);
        if (badgeEl) {
          if (unreadCounts[room] > 0) {
            badgeEl.innerText = unreadCounts[room];
            badgeEl.classList.add('show');
          } else {
            badgeEl.classList.remove('show');
          }
        }
      });
    }

    async function loadMessages() {
      const res = await fetch(`/api/messages?user1=${currentUser}&user2=${activeRoom}`);
      const data = await res.json();
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';

      if (data.success) {
        data.messages.forEach(msg => appendMessage(msg));
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(msg) {
      const chatBox = document.getElementById('chat-box');
      const isSent = msg.sender === currentUser;
      
      const div = document.createElement('div');
      div.className = `message ${isSent ? 'sent' : 'received'}`;
      div.ondblclick = () => triggerReply(msg);

      let replyHtml = '';
      if (msg.replyTo) {
        replyHtml = `
          <div class="quoted-box">
            <strong>${msg.replyTo.sender}</strong>: ${msg.replyTo.text}
          </div>
        `;
      }

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const ticksHtml = isSent 
        ? `<span class="ticks ${msg.read ? 'read' : 'unread'}">${msg.read ? '✓✓' : '✓'}</span>` 
        : '';

      div.innerHTML = `
        ${replyHtml}
        ${!isSent && activeRoom === 'Global' ? `<div style="font-size:0.75rem; font-weight:bold; color:#58a6ff; margin-bottom:2px;">${msg.sender}</div>` : ''}
        <div>${msg.text}</div>
        <div class="time-container">
          <span class="time">${timeStr}</span>
          ${ticksHtml}
        </div>
      `;
      
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function triggerReply(msg) {
      replyTarget = { sender: msg.sender, text: msg.text };
      document.getElementById('reply-user').innerText = msg.sender;
      document.getElementById('reply-text').innerText = msg.text.substring(0, 30);
      document.getElementById('reply-banner').style.display = 'flex';
    }

    function cancelReply() {
      replyTarget = null;
      document.getElementById('reply-banner').style.display = 'none';
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      const payload = {
        sender: currentUser,
        receiver: activeRoom,
        text: text,
        replyTo: replyTarget
      };

      socket.emit('send_message', payload);
      input.value = '';
      cancelReply();
    }

    socket.on('new_message', (msg) => {
      const isForCurrentRoom = 
        (activeRoom === 'Global' && msg.receiver === 'Global') ||
        (msg.sender === activeRoom && msg.receiver === currentUser) ||
        (msg.sender === currentUser && msg.receiver === activeRoom);

      if (isForCurrentRoom) {
        appendMessage(msg);
      } else {
        const roomKey = msg.receiver === 'Global' ? 'Global' : msg.sender;
        unreadCounts[roomKey] = (unreadCounts[roomKey] || 0) + 1;
        updateBadges();
      }
    });

    socket.on('messages_read', () => {
      if (activeRoom !== 'Global') loadMessages();
    });

    socket.on('user_status_change', () => loadUsers());
  </script>
</body>
</html>
