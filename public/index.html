<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header { background-color: #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .logo-box h1 { font-size: 1.1rem; color: #38bdf8; font-weight: 700; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; background-color: #10b981; font-weight: 600; }
    .logout-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; display: none; }
    .notif-btn { background: #0284c7; color: white; border: none; padding: 5px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; display: none; }

    #nav-bar { display: none; background: #1e293b; border-bottom: 1px solid #334155; }
    .nav-tabs { display: flex; overflow-x: auto; }
    .nav-tab { flex: 1; min-width: 90px; text-align: center; padding: 12px; cursor: pointer; color: #94a3b8; font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
    .nav-tab.active { color: #38bdf8; border-bottom: 3px solid #38bdf8; background: #0f172a; }
    .nav-tab.admin-tab { color: #f59e0b; display: none; }

    #auth-screen { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .auth-card { background: #1e293b; width: 100%; max-width: 380px; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #334155; }
    .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: #94a3b8; font-weight: 600; }
    .tab.active { color: #38bdf8; border-bottom: 2px solid #38bdf8; }
    
    .form-group { margin-bottom: 14px; }
    .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 0.95rem; outline: none; }
    .auth-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #0284c7; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .error-msg { color: #f87171; font-size: 0.85rem; margin-top: 10px; text-align: center; }

    .app-view { flex: 1; display: none; flex-direction: column; height: calc(100vh - 105px); overflow-y: auto; }

    .messages-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 14px; background: #334155; align-self: flex-start; word-break: break-word; }
    .message.mine { align-self: flex-end; background: #0284c7; }
    .message .username { font-size: 0.75rem; color: #94a3b8; margin-bottom: 2px; display: block; }
    .message.mine .username { color: #bae6fd; }
    .attached-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 6px; display: block; }
    .attached-file { display: inline-block; margin-top: 6px; padding: 6px 12px; background: #0f172a; color: #38bdf8; text-decoration: none; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }

    .chat-input-bar { display: flex; padding: 12px 16px; background: #1e293b; border-top: 1px solid #334155; gap: 8px; align-items: center; }
    .chat-input-bar input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 20px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
    .chat-input-bar button { padding: 10px 16px; border-radius: 20px; border: none; background: #0284c7; color: white; font-weight: 600; cursor: pointer; }
    .icon-btn { background: #334155 !important; border: 1px solid #475569 !important; font-size: 1rem; border-radius: 50% !important; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 !important; cursor: pointer; }
    .icon-btn.recording { background: #ef4444 !important; animation: pulse 1s infinite; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    #feed-screen { padding: 16px; gap: 16px; }
    .create-post-card { background: #1e293b; padding: 14px; border-radius: 12px; border: 1px solid #334155; }
    .create-post-card textarea { width: 100%; height: 70px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; padding: 10px; outline: none; resize: none; font-size: 0.95rem; }
    .post-attach-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
    .post-btn { padding: 8px 16px; border-radius: 8px; border: none; background: #0284c7; color: white; font-weight: 600; cursor: pointer; }
    
    .posts-list { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
    .post-card { background: #1e293b; padding: 16px; border-radius: 12px; border: 1px solid #334155; }
    .post-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .post-author { font-weight: 700; color: #38bdf8; font-size: 0.95rem; }
    .post-content { font-size: 0.95rem; line-height: 1.4; color: #f1f5f9; margin-bottom: 12px; word-break: break-word; }
    .post-actions { display: flex; gap: 16px; border-top: 1px solid #334155; padding-top: 10px; font-size: 0.85rem; color: #94a3b8; }
    .action-btn { cursor: pointer; display: flex; align-items: center; gap: 4px; font-weight: 600; }

    .comments-section { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #334155; display: none; }
    .comment-item { background: #0f172a; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 0.85rem; display: flex; justify-content: space-between; }
    .comment-author { font-weight: 600; color: #38bdf8; margin-right: 6px; }
    .add-comment-box { display: flex; gap: 6px; margin-top: 8px; }
    .add-comment-box input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 6px 10px; border-radius: 6px; color: white; font-size: 0.85rem; outline: none; }
    .add-comment-box button { background: #0284c7; border: none; color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; }

    #dm-screen { flex-direction: row; }
    .dm-user-list { width: 120px; background: #1e293b; border-right: 1px solid #334155; overflow-y: auto; }
    .dm-user-item { padding: 12px 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border-bottom: 1px solid #334155; color: #94a3b8; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
    .dm-user-item.active { background: #0284c7; color: white; }
    .dm-chat-area { flex: 1; display: flex; flex-direction: column; }
    .dm-header { padding: 10px 14px; background: #1e293b; border-bottom: 1px solid #334155; font-weight: 700; color: #38bdf8; font-size: 0.9rem; }

    /* ADMIN DASHBOARD STYLES */
    #admin-screen { padding: 16px; gap: 16px; }
    .admin-stats { display: flex; gap: 12px; margin-bottom: 16px; }
    .stat-card { flex: 1; background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
    .stat-number { font-size: 1.4rem; font-weight: 800; color: #f59e0b; }
    .stat-label { font-size: 0.75rem; color: #94a3b8; }
    .admin-section { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .admin-title { font-size: 1rem; color: #38bdf8; margin-bottom: 10px; font-weight: 700; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .admin-table th, .admin-table td { padding: 8px; text-align: left; border-bottom: 1px solid #334155; }
    .admin-table th { color: #94a3b8; }
    .btn-danger { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }
    .btn-warning { background: #f59e0b; color: white; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo-box">
      <h1>MikiConnect</h1>
    </div>
    <div class="header-actions">
      <span id="online-badge" class="badge">0 Online</span>
      <button id="notif-btn" class="notif-btn" onclick="requestNotificationPermission()">🔔 Notifs</button>
      <button id="logout-btn" class="logout-btn">Logout</button>
    </div>
  </header>

  <div id="nav-bar">
    <div class="nav-tabs">
      <div id="tab-chat" class="nav-tab active" onclick="switchAppView('chat')">Global Chat</div>
      <div id="tab-dm" class="nav-tab" onclick="switchAppView('dm')">Direct DMs</div>
      <div id="tab-feed" class="nav-tab" onclick="switchAppView('feed')">Social Feed</div>
      <div id="tab-admin" class="nav-tab admin-tab" onclick="switchAppView('admin')">🛡️ Admin</div>
    </div>
  </div>

  <div id="auth-screen">
    <div class="auth-card">
      <div class="tabs">
        <div id="tab-login" class="tab active" onclick="switchAuthTab('login')">Login</div>
        <div id="tab-register" class="tab" onclick="switchAuthTab('register')">Register</div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <input type="email" id="login-email" placeholder="Email address" required>
        </div>
        <div class="form-group">
          <input type="password" id="login-password" placeholder="Password" required>
        </div>
        <button type="submit" class="auth-btn">Log In</button>
      </form>

      <form id="register-form" style="display: none;">
        <div class="form-group">
          <input type="text" id="reg-username" placeholder="Username" required>
        </div>
        <div class="form-group">
          <input type="email" id="reg-email" placeholder="Email address" required>
        </div>
        <div class="form-group">
          <input type="password" id="reg-password" placeholder="Password (min 6 chars)" required>
        </div>
        <button type="submit" class="auth-btn">Create Account</button>
      </form>

      <div id="auth-error" class="error-msg"></div>
    </div>
  </div>

  <!-- Public Global Chat -->
  <div id="chat-screen" class="app-view">
    <div id="messages-container" class="messages-box"></div>
    <form id="chat-form" class="chat-input-bar">
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Direct Messages Screen -->
  <div id="dm-screen" class="app-view">
    <div class="dm-user-list" id="dm-users-list"></div>
    <div class="dm-chat-area">
      <div class="dm-header" id="dm-header-title">Select a contact</div>
      <div id="dm-messages-container" class="messages-box"></div>
      <div class="chat-input-bar">
        <button type="button" id="mic-btn" class="icon-btn" onclick="toggleVoiceRecord()">🎙️</button>
        <button type="button" class="icon-btn" onclick="document.getElementById('dm-file-input').click()">📁</button>
        <input type="file" id="dm-file-input" style="display: none;" onchange="handleDmFileUpload(this)">
        <input type="text" id="dm-input" placeholder="Message or attach..." autocomplete="off">
        <button type="button" onclick="sendDirectMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Social Feed Screen -->
  <div id="feed-screen" class="app-view">
    <div class="create-post-card">
      <textarea id="post-input" placeholder="What's on your mind?"></textarea>
      <div class="post-attach-bar">
        <input type="file" id="post-file-input" accept="image/*,video/*,application/pdf">
        <button class="post-btn" onclick="submitPost()">Post</button>
      </div>
    </div>
    <div id="posts-list" class="posts-list"></div>
  </div>

  <!-- Admin Moderation Dashboard Screen -->
  <div id="admin-screen" class="app-view">
    <div class="admin-stats">
      <div class="stat-card">
        <div class="stat-number" id="stat-users">0</div>
        <div class="stat-label">Total Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-posts">0</div>
        <div class="stat-label">Total Posts</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="stat-dms">0</div>
        <div class="stat-label">Total DMs</div>
      </div>
    </div>

    <div class="admin-section">
      <div class="admin-title">User Management</div>
      <table class="admin-table">
        <thead>
          <tr>
            <th>User</th>
            <th>Role</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="admin-users-list"></tbody>
      </table>
    </div>

    <div class="admin-section">
      <div class="admin-title">Post Moderation</div>
      <div id="admin-posts-list"></div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = JSON.parse(localStorage.getItem('miki_user')) || null;
    let selectedDmUser = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    const authScreen = document.getElementById('auth-screen');
    const navBar = document.getElementById('nav-bar');
    const chatScreen = document.getElementById('chat-screen');
    const dmScreen = document.getElementById('dm-screen');
    const feedScreen = document.getElementById('feed-screen');
    const adminScreen = document.getElementById('admin-screen');
    const logoutBtn = document.getElementById('logout-btn');
    const notifBtn = document.getElementById('notif-btn');
    const onlineBadge = document.getElementById('online-badge');
    const authError = document.getElementById('auth-error');
    const messagesContainer = document.getElementById('messages-container');

    if (currentUser) {
      showMainApp();
    }

    // --- PUSH NOTIFICATION HELPER ---

    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            notifBtn.style.display = 'none';
            new Notification('MikiConnect', { body: 'Browser notifications enabled!' });
          }
        });
      }
    }

    function checkNotificationStatus() {
      if ('Notification' in window) {
        if (Notification.permission === 'default') {
          notifBtn.style.display = 'block';
        } else {
          notifBtn.style.display = 'none';
        }
      }
    }

    function triggerNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        if (document.hidden || document.visibilityState === 'hidden') {
          new Notification(title, { body: body, icon: '/favicon.ico' });
        }
      }
    }

    function switchAuthTab(tab) {
      authError.textContent = '';
      if (tab === 'login') {
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('tab-register').classList.remove('active');
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('register-form').style.display = 'none';
      } else {
        document.getElementById('tab-register').classList.add('active');
        document.getElementById('tab-login').classList.remove('active');
        document.getElementById('register-form').style.display = 'block';
        document.getElementById('login-form').style.display = 'none';
      }
    }

    function switchAppView(view) {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      chatScreen.style.display = 'none';
      dmScreen.style.display = 'none';
      feedScreen.style.display = 'none';
      adminScreen.style.display = 'none';

      if (view === 'chat') {
        document.getElementById('tab-chat').classList.add('active');
        chatScreen.style.display = 'flex';
      } else if (view === 'dm') {
        document.getElementById('tab-dm').classList.add('active');
        dmScreen.style.display = 'flex';
        loadDmUsers();
      } else if (view === 'feed') {
        document.getElementById('tab-feed').classList.add('active');
        feedScreen.style.display = 'flex';
        loadPosts();
      } else if (view === 'admin') {
        document.getElementById('tab-admin').classList.add('active');
        adminScreen.style.display = 'flex';
        loadAdminDashboard();
      }
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('reg-username').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();

      if (data.success) {
        alert('Account created! Log in now.');
        switchAuthTab('login');
      } else {
        authError.textContent = data.error;
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (data.success) {
        currentUser = data.user;
        localStorage.setItem('miki_user', JSON.stringify(currentUser));
        showMainApp();
      } else {
        authError.textContent = data.error;
      }
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('miki_user');
      currentUser = null;
      location.reload();
    });

    function showMainApp() {
      authScreen.style.display = 'none';
      navBar.style.display = 'block';
      logoutBtn.style.display = 'block';

      if (currentUser.role === 'admin') {
        document.getElementById('tab-admin').style.display = 'block';
      }

      checkNotificationStatus();
      switchAppView('chat');
      socket.emit('user_joined', currentUser);
    }

    socket.on('online_count', (count) => { onlineBadge.textContent = `${count} Online`; });

    socket.on('chat_history', (messages) => {
      messagesContainer.innerHTML = '';
      messages.forEach((data) => { renderMessage(data, data.user === currentUser?.username, messagesContainer); });
    });

    document.getElementById('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('message-input');
      if (input.value.trim() && currentUser) {
        socket.emit('chat_message', { user: currentUser.username, text: input.value.trim() });
        input.value = '';
      }
    });

    socket.on('chat_message', (data) => {
      renderMessage(data, data.user === currentUser?.username, messagesContainer);
    });

    function renderMessage(data, isMine, container) {
      const bubble = document.createElement('div');
      bubble.className = `message ${isMine ? 'mine' : ''}`;
      
      let contentHtml = `<span class="username">${data.user || data.sender}</span>`;
      if (data.text) contentHtml += `<div class="text">${data.text}</div>`;
      if (data.audio_data) {
        contentHtml += `<audio controls src="${data.audio_data}" style="max-width: 100%; margin-top: 4px;"></audio>`;
      }
      if (data.file_data) {
        if (data.file_type && data.file_type.startsWith('image/')) {
          contentHtml += `<img src="${data.file_data}" class="attached-img" />`;
        } else {
          contentHtml += `<a href="${data.file_data}" download="${data.file_name || 'attachment'}" class="attached-file">📎 ${data.file_name || 'Download File'}</a>`;
        }
      }

      bubble.innerHTML = contentHtml;
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
    }

    // --- DIRECT MESSAGING LOGIC ---

    async function loadDmUsers() {
      const res = await fetch('/api/users');
      const users = await res.json();
      const list = document.getElementById('dm-users-list');
      list.innerHTML = '';

      users.forEach(u => {
        if (u.username !== currentUser.username) {
          const item = document.createElement('div');
          item.className = `dm-user-item ${selectedDmUser === u.username ? 'active' : ''}`;
          item.textContent = `@${u.username}`;
          item.onclick = () => selectDmUser(u.username, item);
          list.appendChild(item);
        }
      });
    }

    async function selectDmUser(username, element) {
      selectedDmUser = username;
      document.querySelectorAll('.dm-user-item').forEach(i => i.classList.remove('active'));
      if (element) element.classList.add('active');
      document.getElementById('dm-header-title').textContent = `Chatting with @${username}`;

      const res = await fetch(`/api/dm/${currentUser.username}/${username}`);
      const messages = await res.json();
      const container = document.getElementById('dm-messages-container');
      container.innerHTML = '';

      messages.forEach(m => {
        renderMessage(m, m.sender === currentUser.username, container);
      });
    }

    function sendDirectMessage(audioBase64 = null, fileObj = null) {
      if (!selectedDmUser) return alert('Select a user to chat with!');
      const input = document.getElementById('dm-input');
      const text = input.value.trim();

      if (!text && !audioBase64 && !fileObj) return;

      socket.emit('private_message', {
        sender: currentUser.username,
        recipient: selectedDmUser,
        text: text || null,
        audio_data: audioBase64 || null,
        file_data: fileObj ? fileObj.data : null,
        file_name: fileObj ? fileObj.name : null,
        file_type: fileObj ? fileObj.type : null
      });

      input.value = '';
    }

    function handleDmFileUpload(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        sendDirectMessage(null, {
          data: e.target.result,
          name: file.name,
          type: file.type
        });
        input.value = '';
      };
      reader.readAsDataURL(file);
    }

    socket.on('private_message', (msg) => {
      if (
        (msg.sender === selectedDmUser && msg.recipient === currentUser.username) ||
        (msg.sender === currentUser.username && msg.recipient === selectedDmUser)
      ) {
        const container = document.getElementById('dm-messages-container');
        renderMessage(msg, msg.sender === currentUser.username, container);
      }

      if (msg.recipient === currentUser?.username) {
        const notifText = msg.text ? msg.text : (msg.file_data ? 'Sent you an attachment 📎' : 'Sent you a voice note 🎙️');
        triggerNotification(`New DM from @${msg.sender}`, notifText);
      }
    });

    socket.on('new_comment_notification', (data) => {
      if (data.postAuthor === currentUser?.username && data.commenter !== currentUser?.username) {
        triggerNotification(`New Comment on your post!`, `@${data.commenter}: ${data.comment}`);
      }
    });

    // --- VOICE NOTE LOGIC ---

    async function toggleVoiceRecord() {
      const micBtn = document.getElementById('mic-btn');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = async () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => {
              sendDirectMessage(reader.result);
            };
          };

          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add('recording');
        } catch (err) {
          alert('Microphone access denied or unavailable.');
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
      }
    }

    // --- SOCIAL FEED LOGIC ---

    async function loadPosts() {
      const res = await fetch('/api/posts');
      const posts = await res.json();
      const list = document.getElementById('posts-list');
      list.innerHTML = '';

      posts.forEach(post => {
        const card = document.createElement('div');
        card.className = 'post-card';
        
        let fileMarkup = '';
        if (post.file_data) {
          if (post.file_type && post.file_type.startsWith('image/')) {
            fileMarkup = `<img src="${post.file_data}" class="attached-img" />`;
          } else {
            fileMarkup = `<a href="${post.file_data}" download="${post.file_name || 'attachment'}" class="attached-file">📎 ${post.file_name || 'Download File'}</a>`;
          }
        }

        card.innerHTML = `
          <div class="post-header"><span class="post-author">@${post.username}</span></div>
          <div class="post-content">${post.content}</div>
          ${fileMarkup}
          <div class="post-actions">
            <span class="action-btn" onclick="likePost(${post.id}, this)">❤️ <span class="like-count">${post.likes}</span></span>
            <span class="action-btn" onclick="toggleComments(${post.id})">💬 <span>${post.comment_count}</span> Comments</span>
          </div>
          <div id="comments-${post.id}" class="comments-section">
            <div id="comment-list-${post.id}"></div>
            <div class="add-comment-box">
              <input type="text" id="comment-input-${post.id}" placeholder="Write a comment...">
              <button onclick="submitComment(${post.id}, '${post.username}')">Reply</button>
            </div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    async function submitPost() {
      const content = document.getElementById('post-input').value.trim();
      const fileInput = document.getElementById('post-file-input');
      const file = fileInput.files[0];

      if (!content && !file) return alert('Post cannot be empty!');

      if (file) {
        const reader = new FileReader();
        reader.onload = async function(e) {
          await sendPostApi(content, e.target.result, file.name, file.type);
          fileInput.value = '';
        };
        reader.readAsDataURL(file);
      } else {
        await sendPostApi(content, null, null, null);
      }
    }

    async function sendPostApi(content, fileData, fileName, fileType) {
      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: currentUser.username,
          content,
          file_data: fileData,
          file_name: fileName,
          file_type: fileType
        })
      });
      const data = await res.json();

      if (data.success) {
        document.getElementById('post-input').value = '';
        loadPosts();
      }
    }

    async function likePost(postId, el) {
      const res = await fetch(`/api/posts/${postId}/like`, { method: 'POST' });
      const data = await res.json();
      if (data.success) { el.querySelector('.like-count').textContent = data.likes; }
    }

    async function toggleComments(postId) {
      const box = document.getElementById(`comments-${postId}`);
      if (box.style.display === 'block') box.style.display = 'none';
      else { box.style.display = 'block'; loadComments(postId); }
    }

    async function loadComments(postId) {
      const res = await fetch(`/api/posts/${postId}/comments`);
      const comments = await res.json();
      const list = document.getElementById(`comment-list-${postId}`);
      list.innerHTML = '';

      comments.forEach(c => {
        const item = document.createElement('div');
        item.className = 'comment-item';
        
        let deleteBtn = '';
        if (currentUser.role === 'admin') {
          deleteBtn = `<button class="btn-danger" onclick="deleteCommentAdmin(${c.id}, ${postId})">Delete</button>`;
        }

        item.innerHTML = `<div><span class="comment-author">@${c.username}:</span>${c.comment}</div>${deleteBtn}`;
        list.appendChild(item);
      });
    }

    async function submitComment(postId, postAuthor) {
      const input = document.getElementById(`comment-input-${postId}`);
      const comment = input.value.trim();
      if (!comment) return;

      const res = await fetch(`/api/posts/${postId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: currentUser.username, comment, postAuthor })
      });
      const data = await res.json();

      if (data.success) { 
        input.value = ''; 
        loadComments(postId); 
      }
    }

    // --- ADMIN DASHBOARD LOGIC ---

    async function loadAdminDashboard() {
      if (currentUser.role !== 'admin') return;

      const statsRes = await fetch('/api/admin/stats');
      const stats = await statsRes.json();
      document.getElementById('stat-users').textContent = stats.users;
      document.getElementById('stat-posts').textContent = stats.posts;
      document.getElementById('stat-dms').textContent = stats.dms;

      const usersRes = await fetch('/api/admin/users');
      const users = await usersRes.json();
      const userTbody = document.getElementById('admin-users-list');
      userTbody.innerHTML = '';

      users.forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>@${u.username}</td>
          <td>${u.role}</td>
          <td>
            ${u.username !== currentUser.username ? `
              <button class="btn-danger" onclick="deleteUserAdmin(${u.id})">Ban/Delete</button>
              ${u.role !== 'admin' ? `<button class="btn-warning" onclick="makeAdmin(${u.id})">Make Admin</button>` : ''}
            ` : '<em>You</em>'}
          </td>
        `;
        userTbody.appendChild(tr);
      });

      const postsRes = await fetch('/api/posts');
      const posts = await postsRes.json();
      const adminPostsDiv = document.getElementById('admin-posts-list');
      adminPostsDiv.innerHTML = '';

      posts.forEach(p => {
        const div = document.createElement('div');
        div.style.cssText = "background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;";
        div.innerHTML = `
          <div>
            <strong>@${p.username}</strong>: ${p.content || '<em>[File attached]</em>'}
          </div>
          <button class="btn-danger" onclick="deletePostAdmin(${p.id})">Delete Post</button>
        `;
        adminPostsDiv.appendChild(div);
      });
    }

    async function deleteUserAdmin(id) {
      if (!confirm('Are you sure you want to delete/ban this user?')) return;
      await fetch(`/api/admin/users/${id}?admin_username=${currentUser.username}`, { method: 'DELETE' });
      loadAdminDashboard();
    }

    async function makeAdmin(id) {
      await fetch(`/api/admin/users/${id}/make-admin?admin_username=${currentUser.username}`, { method: 'POST' });
      loadAdminDashboard();
    }

    async function deletePostAdmin(id) {
      if (!confirm('Delete this post?')) return;
      await fetch(`/api/admin/posts/${id}?admin_username=${currentUser.username}`, { method: 'DELETE' });
      loadAdminDashboard();
    }

    async function deleteCommentAdmin(commentId, postId) {
      await fetch(`/api/admin/comments/${commentId}?admin_username=${currentUser.username}`, { method: 'DELETE' });
      loadComments(postId);
    }
  </script>
</body>
</html>
