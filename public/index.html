<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #eef2f5; color: #333; }

    /* Header & Navigation */
    header { background: #007bff; color: white; padding: 15px; text-align: center; }
    .nav-tabs { display: flex; background: #0056b3; justify-content: space-around; }
    .nav-tab { flex: 1; padding: 12px; text-align: center; color: white; cursor: pointer; font-weight: bold; }
    .nav-tab.active { background: #004085; border-bottom: 3px solid #ffc107; }

    .container { max-width: 600px; margin: 15px auto; padding: 15px; }

    /* Auth Cards */
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 15px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }

    /* Post Cards */
    .post-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #007bff; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .post-header { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-bottom: 8px; }
    .like-btn { background: #e9ecef; color: #333; width: auto; padding: 5px 12px; font-size: 13px; }
    .like-btn.liked { background: #dc3545; color: white; }

    /* Comments */
    .comments-section { background: #f8f9fa; padding: 10px; border-radius: 5px; margin-top: 10px; }
    .comment-item { font-size: 13px; margin: 4px 0; }
    .comment-box { display: flex; gap: 5px; }
    .comment-box input { margin: 0; }
    .comment-box button { width: auto; margin: 0; padding: 6px 12px; }

    /* Real-Time Chat */
    #chat-box { height: 250px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 5px; background: #fafafa; margin-bottom: 10px; }
    .chat-msg { margin-bottom: 8px; font-size: 14px; }
    .chat-msg <strong> { color: #007bff; }

    /* Admin List */
    ul { list-style: none; }
    li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .del-btn { background: #dc3545; width: auto; padding: 4px 8px; font-size: 12px; }
    
    #user-bar { background: #343a40; color: white; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    #user-bar button { width: auto; padding: 4px 10px; margin: 0; background: #dc3545; font-size: 12px; }
  </style>
</head>
<body>

  <header>
    <h2>MikiConnect</h2>
  </header>

  <div id="user-bar" style="display: none;">
    <span id="user-display">Logged in as @user</span>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('feed-tab', this)">Feed</div>
    <div class="nav-tab" onclick="switchTab('chat-tab', this)">Chat</div>
    <div class="nav-tab" onclick="switchTab('admin-tab', this)">Admin</div>
    <div class="nav-tab" id="auth-tab-btn" onclick="switchTab('auth-tab', this)">Account</div>
  </div>

  <div class="container">

    <!-- AUTH TAB (Login & Register) -->
    <div id="auth-tab" class="tab-content">
      <div class="card">
        <h3>Login</h3>
        <input type="text" id="login-id" placeholder="Username or Email" />
        <input type="password" id="login-pass" placeholder="Password" />
        <button onclick="login()">Login</button>
      </div>

      <div class="card">
        <h3>Register</h3>
        <input type="text" id="reg-user" placeholder="Username" />
        <input type="email" id="reg-email" placeholder="Email" />
        <input type="password" id="reg-pass" placeholder="Password" />
        <button onclick="register()">Create Account</button>
      </div>
    </div>

    <!-- FEED TAB -->
    <div id="feed-tab" class="tab-content active">
      <div class="card">
        <h3>Create Post</h3>
        <textarea id="post-content" rows="3" placeholder="What's on your mind?"></textarea>
        <button onclick="createPost()">Publish Post</button>
      </div>

      <div id="feed-container">
        <p>Loading feed...</p>
      </div>
    </div>

    <!-- CHAT TAB -->
    <div id="chat-tab" class="tab-content">
      <div class="card">
        <h3>Live Public Chat</h3>
        <div id="chat-box"></div>
        <div style="display: flex; gap: 5px;">
          <input type="text" id="chat-input" placeholder="Type a message..." style="margin: 0;" />
          <button onclick="sendChatMessage()" style="width: auto; margin: 0;">Send</button>
        </div>
      </div>
    </div>

    <!-- ADMIN TAB -->
    <div id="admin-tab" class="tab-content">
      <div class="card">
        <h3>Admin Moderation Panel</h3>
        <button onclick="loadAdminUsers()" style="margin-bottom: 10px;">Refresh Registered Users</button>
        <ul id="admin-user-list"></ul>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
