<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect</title>
  
  <!-- Web App Manifest -->
  <link rel="manifest" href="/manifest.json">

  <!-- Socket.IO Client Library -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Header */
    header {
      background-color: #1e293b;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .status-pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      background-color: #ef4444;
      color: #ffffff;
      font-weight: 600;
    }

    .status-pill.online {
      background-color: #10b981;
    }

    /* Join / Login Screen */
    #login-screen {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background-color: #1e293b;
      width: 100%;
      max-width: 380px;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .login-card h2 {
      margin-bottom: 8px;
      font-size: 1.4rem;
    }

    .login-card p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .login-card input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
    }

    .login-card button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: #0284c7;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Main Chat Interface */
    #chat-screen {
      flex: 1;
      display: none;
      flex-direction: column;
      height: calc(100vh - 60px);
    }

    #messages-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      background-color: #334155;
      align-self: flex-start;
      word-break: break-word;
    }

    .message.mine {
      align-self: flex-end;
      background-color: #0284c7;
    }

    .message .username {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 4px;
      display: block;
    }

    .message.mine .username {
      color: #bae6fd;
    }

    .system-event {
      text-align: center;
      font-size: 0.8rem;
      color: #64748b;
      margin: 4px 0;
    }

    /* Bottom Input Bar */
    #chat-form {
      display: flex;
      padding: 12px 16px;
      background-color: #1e293b;
      border-top: 1px solid #334155;
      gap: 10px;
    }

    #chat-form input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      outline: none;
    }

    #chat-form button {
      padding: 12px 20px;
      border-radius: 24px;
      border: none;
      background-color: #0284c7;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header>
    <h1>MikiConnect</h1>
    <span id="connection-badge" class="status-pill">Connecting...</span>
  </header>

  <!-- Login Modal -->
  <div id="login-screen">
    <div class="login-card">
      <h2>Welcome to MikiConnect</h2>
      <p>Enter a display name to start chatting</p>
      <input type="text" id="username-input" placeholder="Your display name..." autocomplete="off">
      <button id="join-btn">Join Chat</button>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen">
    <div id="messages-container"></div>

    <form id="chat-form">
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    // Connect to Socket.IO backend
    const socket = io();

    const connectionBadge = document.getElementById('connection-badge');
    const loginScreen = document.getElementById('login-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username-input');
    const joinBtn = document.getElementById('join-btn');
    const messagesContainer = document.getElementById('messages-container');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');

    let currentUser = '';

    // Handle Socket Connection Status
    socket.on('connect', () => {
      connectionBadge.textContent = 'Online';
      connectionBadge.classList.add('online');
    });

    socket.on('disconnect', () => {
      connectionBadge.textContent = 'Offline';
      connectionBadge.classList.remove('online');
    });

    // Handle Joining Chat
    function joinChat() {
      const name = usernameInput.value.trim();
      if (name) {
        currentUser = name;
        socket.emit('user_joined', currentUser);
        loginScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
        messageInput.focus();
      }
    }

    joinBtn.addEventListener('click', joinChat);
    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinChat();
    });

    // Receive and render chat history from SQLite on connect
    socket.on('chat_history', (messages) => {
      messagesContainer.innerHTML = '';
      messages.forEach((data) => {
        const isMine = data.user === currentUser;
        renderMessage(data, isMine);
      });
    });

    // Send Message
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (text) {
        const payload = { user: currentUser, text: text };
        socket.emit('chat_message', payload);
        renderMessage(payload, true);
        messageInput.value = '';
      }
    });

    // Receive Message from Server
    socket.on('chat_message', (data) => {
      if (data.user !== currentUser) {
        renderMessage(data, false);
      }
    });

    // Receive System Event
    socket.on('system_message', (msg) => {
      const sysDiv = document.createElement('div');
      sysDiv.className = 'system-event';
      sysDiv.textContent = msg;
      messagesContainer.appendChild(sysDiv);
      scrollToBottom();
    });

    // Render Chat Bubbles
    function renderMessage(data, isMine) {
      const bubble = document.createElement('div');
      bubble.className = `message ${isMine ? 'mine' : ''}`;
      bubble.innerHTML = `
        <span class="username">${data.user}</span>
        <div class="text">${data.text}</div>
      `;
      messagesContainer.appendChild(bubble);
      scrollToBottom();
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
  </script>
</body>
</html>
