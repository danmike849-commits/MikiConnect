<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MikiConnect - Chats</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
    }

    .messenger-container {
      display: flex;
      width: 100vw;
      height: 100dvh;
    }

    /* Left Panel: Inbox & Active Contacts */
    .inbox-panel {
      width: 100%;
      max-width: 360px;
      background-color: #121212;
      border-right: 1px solid #2f2f2f;
      display: flex;
      flex-direction: column;
    }

    .panel-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #e4e6eb;
    }

    /* Active Stories Row */
    .active-users-row {
      display: flex;
      gap: 14px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid #242526;
      scrollbar-width: none;
    }

    .active-users-row::-webkit-scrollbar {
      display: none;
    }

    .user-avatar-wrapper {
      position: relative;
      flex-shrink: 0;
      text-align: center;
      width: 56px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #3a3b3c;
    }

    .active-dot {
      width: 14px;
      height: 14px;
      background-color: #31a24c;
      border-radius: 50%;
      border: 2px solid #121212;
      position: absolute;
      bottom: 18px;
      right: 2px;
    }

    .avatar-name {
      font-size: 11px;
      color: #b0b3b8;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Inbox List */
    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chat-item:hover, .chat-item.active {
      background-color: #242526;
    }

    .chat-details {
      flex: 1;
      overflow: hidden;
    }

    .chat-details .name {
      font-weight: 600;
      font-size: 15px;
      color: #f5f6f7;
    }

    .chat-details .last-message {
      font-size: 13px;
      color: #b0b3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Right Panel: Active Chat Room */
    .chat-view-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #000000;
    }

    .chat-header {
      padding: 12px 16px;
      background-color: #121212;
      border-bottom: 1px solid #242526;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header .chat-info h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .chat-header .chat-info p {
      font-size: 12px;
      color: #31a24c;
    }

    /* Messages Area */
    .messages-container {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message-bubble {
      max-width: 65%;
      padding: 10px 14px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message-bubble.received {
      align-self: flex-start;
      background-color: #242526;
      color: #e4e6eb;
      border-radius: 18px 18px 18px 4px;
    }

    .message-bubble.sent {
      align-self: flex-end;
      background-color: #0084ff;
      color: #ffffff;
      border-radius: 18px 18px 4px 18px;
    }

    .message-media {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 6px;
    }

    /* Chat Input Bar */
    .chat-input-bar {
      padding: 12px;
      background-color: #121212;
      border-top: 1px solid #242526;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #0084ff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-input-bar input[type="text"] {
      flex: 1;
      background-color: #242526;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .chat-input-bar input[type="text"]::placeholder {
      color: #b0b3b8;
    }

    .send-btn {
      background: none;
      border: none;
      color: #0084ff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    /* Responsive mobile view */
    @media (max-width: 768px) {
      .chat-view-panel {
        display: flex;
      }
      .inbox-panel {
        display: none; /* Can be toggled using JS when switching screens */
      }
    }
  </style>
</head>
<body>

  <div class="messenger-container">
    
    <!-- Left Panel: Inbox -->
    <aside class="inbox-panel" id="inbox-panel">
      <div class="panel-header">
        <h1>Chats</h1>
      </div>

      <!-- Active Users Row -->
      <div class="active-users-row" id="active-users">
        <div class="user-avatar-wrapper">
          <img src="https://via.placeholder.com/50" class="avatar" alt="User">
          <div class="active-dot"></div>
          <div class="avatar-name">Mika</div>
        </div>
      </div>

      <!-- Inbox Threads -->
      <div class="chat-list" id="chat-list">
        <div class="chat-item active">
          <img src="https://via.placeholder.com/50" class="avatar" alt="Avatar">
          <div class="chat-details">
            <div class="name">General Chat</div>
            <div class="last-message">Welcome to MikiConnect Messenger!</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Right Panel: Messenger Workspace -->
    <main class="chat-view-panel" id="chat-view-panel">
      
      <!-- Chat Header -->
      <div class="chat-header">
        <img src="https://via.placeholder.com/50" class="avatar" alt="Avatar" id="chat-header-avatar">
        <div class="chat-info">
          <h3 id="chat-header-title">General Chat</h3>
          <p id="chat-header-status">Active now</p>
        </div>
      </div>

      <!-- Messages Thread -->
      <div class="messages-container" id="messages-container">
        <div class="message-bubble received">
          Hey Mika! Welcome to the new Messenger interface.
        </div>
        <div class="message-bubble sent">
          Looks clean! Ready to send images and voice notes.
        </div>
      </div>

      <!-- Input Actions -->
      <div class="chat-input-bar">
        <label class="icon-btn" title="Send Photo/Video">
          📷
          <input type="file" id="media-input" accept="image/*,video/*" hidden>
        </label>
        <button class="icon-btn" id="mic-btn" title="Voice Note">🎙️</button>
        <input type="text" id="message-input" placeholder="Aa" autocomplete="off">
        <button class="send-btn" id="send-btn">➤</button>
      </div>

    </main>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const sendBtn = document.getElementById('send-btn');
    const messageInput = document.getElementById('message-input');
    const messagesContainer = document.getElementById('messages-container');

    // Send Message Trigger
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      // Render sent bubble locally
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble sent';
      bubble.innerText = text;
      messagesContainer.appendChild(bubble);

      messageInput.value = '';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      // Socket emit
      socket.emit('chatMessage', { text });
    }

    // Socket listener for incoming messages
    socket.on('message', (data) => {
      const bubble = document.createElement('div');
      bubble.className = 'message-bubble received';
      bubble.innerText = data.text;
      messagesContainer.appendChild(bubble);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });
  </script>
</body>
</html>
