<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #1e232a; color: #e1e6ed; }
    header { background: #0d2818; color: #40c057; padding: 15px; text-align: center; border-bottom: 2px solid #164228; }

    .online-bar { background: #164228; color: #a9e34b; padding: 8px 15px; font-size: 13px; display: flex; align-items: center; gap: 8px; overflow-x: auto; white-space: nowrap; }
    .status-dot { width: 8px; height: 8px; background: #40c057; border-radius: 50%; display: inline-block; }

    .nav-tabs { display: flex; background: #0f1217; border-bottom: 1px solid #2b313a; overflow-x: auto; }
    .nav-tab { flex: 1; padding: 12px; text-align: center; color: #909296; cursor: pointer; font-weight: bold; white-space: nowrap; }
    .nav-tab.active { color: #40c057; border-bottom: 3px solid #40c057; background: #164228; }

    .container { max-width: 600px; margin: 15px auto; padding: 0 10px; }
    .card { background: #2b313a; padding: 18px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #3b424e; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    input, textarea, button, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #3b424e; background: #1e232a; color: #fff; font-size: 14px; }
    button { background: #164228; color: #40c057; border: 1px solid #40c057; cursor: pointer; font-weight: bold; }
    button:hover { background: #40c057; color: #0d2818; }

    .media-btn-row { display: flex; gap: 5px; margin: 5px 0; }
    .media-btn-row label { flex: 1; text-align: center; background: #1e232a; padding: 8px; border: 1px solid #3b424e; border-radius: 5px; cursor: pointer; font-size: 12px; }

    /* Post Styles */
    .post-card { background: #2b313a; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #40c057; }
    .post-header { display: flex; justify-content: space-between; font-size: 13px; color: #adb5bd; margin-bottom: 8px; }
    .post-media { width: 100%; max-height: 300px; object-fit: cover; border-radius: 6px; margin: 8px 0; }

    /* Chat UI */
    .chat-box { height: 280px; overflow-y: auto; border: 1px solid #3b424e; padding: 10px; border-radius: 5px; background: #1e232a; margin-bottom: 10px; }
    .chat-msg { background: #2b313a; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; }
    .chat-controls { display: flex; flex-direction: column; gap: 5px; }

    #user-bar { background: #0d2818; color: white; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
    .logout-btn { background: #c92a2a; color: #fff; border: none; width: auto; padding: 6px 12px; margin: 0; }
  </style>
</head>
<body>

  <header>
    <h2>MikiConnect</h2>
  </header>

  <div class="online-bar">
    <span class="status-dot"></span> Active Users: <span id="online-users-list">None online</span>
  </div>

  <div id="user-bar" style="display: none;">
    <span id="user-display">Logged in</span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('feed-tab', this)">Feed</div>
    <div class="nav-tab" onclick="switchTab('chat-tab', this)">Live Chat</div>
    <div class="nav-tab" onclick="switchTab('groups-tab', this)">Groups</div>
    <div class="nav-tab" id="admin-tab-btn" style="display: none;" onclick="switchTab('admin-tab', this)">Admin</div>
    <div class="nav-tab" id="auth-tab-btn" onclick="switchTab('auth-tab', this)">Account</div>
  </div>

  <div class="container">

    <!-- FEED TAB -->
    <div id="feed-tab" class="tab-content active">
      <div class="card">
        <h3>Create Post</h3>
        <textarea id="post-content" rows="3" placeholder="What's on your mind?"></textarea>
        
        <div class="media-btn-row">
          <label>📷 Add Picture <input type="file" id="post-img-file" accept="image/*" style="display:none;" onchange="previewMedia(this, 'img-preview')"></label>
          <label>🎥 Add Video <input type="file" id="post-vid-file" accept="video/*" style="display:none;" onchange="previewMedia(this, 'vid-preview')"></label>
        </div>
        <p id="img-preview" style="font-size: 11px; color: #40c057;"></p>
        <p id="vid-preview" style="font-size: 11px; color: #40c057;"></p>

        <button onclick="createPost()">Publish Post</button>
      </div>

      <div id="feed-container">
        <p>Loading feed...</p>
      </div>
    </div>

    <!-- LIVE CHAT TAB -->
    <div id="chat-tab" class="tab-content">
      <div class="card">
        <h3>Live Public Chat</h3>
        <div id="public-chat-box" class="chat-box"></div>
        
        <div class="chat-controls">
          <input type="text" id="chat-msg-input" placeholder="Type a message..." />
          
          <div class="media-btn-row">
            <label>📷 Photo <input type="file" id="chat-img" accept="image/*" style="display:none;"></label>
            <label>🎥 Video/Cam <input type="file" id="chat-vid" accept="video/*" capture="user" style="display:none;"></label>
            <button type="button" onclick="toggleVoiceRecord()" id="voice-btn" style="flex:1; margin:0; padding:8px; font-size:12px;">🎙️ Record Voice</button>
          </div>

          <div style="display: flex; gap: 5px;">
            <select id="emoji-select" style="width: auto;" onchange="addEmoji(this.value)">
              <option value="">😃 Emojis</option>
              <option value="❤️">❤️ Love</option>
              <option value="👍">👍 Like</option>
              <option value="🔥">🔥 Fire</option>
              <option value="😂">😂 Laugh</option>
            </select>
            <button onclick="sendChatMessage('public')" style="flex: 1;">Send Message</button>
          </div>
        </div>
      </div>
    </div>

    <!-- GROUPS TAB -->
    <div id="groups-tab" class="tab-content">
      <div class="card">
        <h3>Create Group Forum</h3>
        <input type="text" id="group-name-input" placeholder="Group Forum Name..." />
        <button onclick="createGroup()">Create Forum</button>
      </div>

      <div class="card">
        <h3>Group Forums</h3>
        <select id="active-group-select" onchange="loadGroupChat(this.value)">
          <option value="">Select a Group Forum...</option>
        </select>
        <div id="group-chat-box" class="chat-box" style="margin-top: 10px;"></div>
        <button onclick="sendChatMessage('group')">Send to Group</button>
      </div>
    </div>

    <!-- ADMIN TAB -->
    
    <!-- ADMIN TAB -->
    <div id="admin-tab" class="tab-content" style="display: none; padding: 15px;">
        <div style="background: #25282c; border-radius: 8px; padding: 20px; border: 1px solid #333;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: #fff; margin: 0;">Admin Dashboard</h3>
                <span id="admin-total-users" style="background: #2b5235; color: #40c057; padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: bold;">0 Users</span>
            </div>
            <button onclick="loadUsersList()" style="width: 100%; background: #40c057; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 15px;">
                Refresh Users List
            </button>
            <div id="admin-users-display" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
    </div>


    <!-- ACCOUNT TAB -->
    
    <!-- AUTH TAB -->
    <div id="auth-tab" class="tab-content">
        <!-- REGISTER SECTION (DEFAULT VISIBLE) -->
        <div id="register-section" style="display: block; background: #25282c; padding: 20px; border-radius: 8px; border: 1px solid #333;">
            <h3 style="color: #fff; margin-top: 0; margin-bottom: 15px;">Register Account</h3>
            <div style="margin-bottom: 10px;">
                <input type="text" id="reg-user" placeholder="Username" style="width: 100%; padding: 10px; background: #181a1d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box;" />
            </div>
            <div style="margin-bottom: 10px;">
                <input type="email" id="reg-email" placeholder="Email" style="width: 100%; padding: 10px; background: #181a1d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box;" />
            </div>
            <div style="margin-bottom: 15px;">
                <input type="password" id="reg-pass" placeholder="Password" style="width: 100%; padding: 10px; background: #181a1d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box;" />
            </div>
            <button onclick="register()" style="width: 100%; background: #40c057; color: #fff; border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-size: 15px; cursor: pointer;">Create Account</button>
            <p style="text-align: center; margin-top: 15px; color: #aaa; font-size: 13px;">
                Already have an account? <a href="#" onclick="showAuthMode('login'); return false;" style="color: #40c057; font-weight: bold; text-decoration: none;">Login here</a>
            </p>
        </div>

        <!-- LOGIN SECTION (HIDDEN BY DEFAULT) -->
        <div id="login-section" style="display: none; background: #25282c; padding: 20px; border-radius: 8px; border: 1px solid #333;">
            <h3 style="color: #fff; margin-top: 0; margin-bottom: 15px;">Login</h3>
            <div style="margin-bottom: 10px;">
                <input type="text" id="login-id" placeholder="Username or Email" style="width: 100%; padding: 10px; background: #181a1d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box;" />
            </div>
            <div style="margin-bottom: 15px;">
                <input type="password" id="login-pass" placeholder="Password" style="width: 100%; padding: 10px; background: #181a1d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box;" />
            </div>
            <button onclick="login()" style="width: 100%; background: #40c057; color: #fff; border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-size: 15px; cursor: pointer;">Login</button>
            <p style="text-align: center; margin-top: 15px; color: #aaa; font-size: 13px;">
                Need an account? <a href="#" onclick="showAuthMode('register'); return false;" style="color: #40c057; font-weight: bold; text-decoration: none;">Register here</a>
            </p>
        </div>
    </div>


  </div>

  <script src="app.js?v=1786520924478"></script>
</body>
</html>
