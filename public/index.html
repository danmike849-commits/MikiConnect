<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; }
    header { background: #121212; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
    .logo { font-size: 18px; font-weight: bold; color: #0084ff; }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .nav-btn { background: none; border: none; color: #00e676; font-size: 13px; cursor: pointer; padding: 6px 10px; border-radius: 6px; text-decoration: none; }
    .btn-logout { color: #ff4444; }
    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 75%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-break: break-word; }
    .message.sent { background: #0084ff; align-self: flex-end; color: #fff; }
    .message.received { background: #222; align-self: flex-start; color: #eee; }
    .message .sender { font-size: 11px; opacity: 0.7; margin-bottom: 3px; display: block; }
    footer { padding: 12px; background: #121212; border-top: 1px solid #222; display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: #222; border: 1px solid #333; color: #fff; padding: 10px 14px; border-radius: 20px; font-size: 14px; outline: none; }
    button.send-btn { background: #0084ff; color: #fff; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    #auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .auth-box { background: #181818; padding: 24px; border-radius: 12px; width: 90%; max-width: 320px; border: 1px solid #282828; }
    .auth-box h2 { margin-bottom: 16px; font-size: 18px; text-align: center; }
    .auth-box input { width: 100%; margin-bottom: 12px; }
    .auth-box button { width: 100%; background: #0084ff; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="auth-modal">
    <div class="auth-box">
      <h2>Welcome to MikiConnect</h2>
      <input type="text" id="auth-username" placeholder="Username">
      <input type="password" id="auth-password" placeholder="Password">
      <button onclick="handleAuth()">Login / Register</button>
    </div>
  </div>

  <header>
    <div class="logo">MikiConnect</div>
    <div class="nav-actions">
      <button id="admin-link" onclick="location.href='/admin.html'" style="display:none;" class="nav-btn">⚙️ Admin</button>
      <button onclick="logout()" class="nav-btn btn-logout">Logout</button>
    </div>
  </header>

  <div id="chat-container"></div>

  <footer>
    <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMsg()">
    <button class="send-btn" onclick="sendMsg()">Send</button>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket;
    const token = localStorage.getItem('token');
    let currentUser = localStorage.getItem('username');
    let userRole = localStorage.getItem('role');

    if (currentUser) {
      document.getElementById('auth-modal').style.display = 'none';
      if (userRole === 'admin') {
        document.getElementById('admin-link').style.display = 'inline-block';
      }
      initApp();
    }

    async function handleAuth() {
      const username = document.getElementById('auth-username').value;
      const password = document.getElementById('auth-password').value;
      if (!username || !password) return alert('Enter credentials');

      const res = await fetch('/api/auth/register-or-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.username) {
        if (data.token) localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);
        localStorage.setItem('role', data.role);
        currentUser = data.username;
        userRole = data.role;
        document.getElementById('auth-modal').style.display = 'none';
        if (userRole === 'admin') {
          document.getElementById('admin-link').style.display = 'inline-block';
        }
        initApp();
      } else {
        alert(data.error || 'Authentication failed');
      }
    }

    function initApp() {
      socket = io();
      socket.on('receiveMessage', (msg) => {
        appendMsg(msg);
      });
    }

    function sendMsg() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !socket) return;
      socket.emit('sendMessage', { sender: currentUser, text });
      input.value = '';
    }

    function appendMsg(msg) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      const isSent = msg.sender === currentUser;
      div.className = `message ${isSent ? 'sent' : 'received'}`;
      div.innerHTML = `<span class="sender">${msg.sender}</span>${msg.text}`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function logout() {
      localStorage.clear();
      location.reload();
    }
  </script>
</body>
</html>
