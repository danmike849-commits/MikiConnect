<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }
    
    header { background-color: #161b22; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
    header h1 { font-size: 1.2rem; color: #2ea44f; display: flex; align-items: center; gap: 8px; }
    .header-btns { display: flex; gap: 8px; }
    .btn-action { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .btn-admin { background: #d97706; color: #fff; border: none; font-weight: bold; display: none; }
    
    .room-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px; background-color: #161b22; border-bottom: 1px solid #30363d; }
    .room-tab { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 8px 14px; border-radius: 20px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
    .room-tab.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
    
    .badge { background-color: #2ea44f; color: white; font-size: 0.75rem; font-weight: bold; padding: 2px 6px; border-radius: 10px; display: none; }
    .badge.show { display: inline-block; }

    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .message.received { background: #21262d; align-self: flex-start; border-bottom-left-radius: 2px; }
    .message.sent { background: #0b84ff; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .message .sender { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; color: #58a6ff; }
    .message .time { font-size: 0.65rem; opacity: 0.7; margin-top: 4px; text-align: right; }

    footer { padding: 12px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 10px 14px; border-radius: 20px; outline: none; }
    button.send-btn { background: #0b84ff; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Admin Panel Overlay */
    #admin-modal { position: fixed; inset: 0; background: rgba(13, 17, 23, 0.95); display: none; flex-direction: column; padding: 20px; z-index: 90; overflow-y: auto; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 8px; text-align: center; }
    .stat-card h4 { font-size: 0.8rem; color: #8b949e; }
    .stat-card p { font-size: 1.2rem; font-weight: bold; color: #2ea44f; margin-top: 4px; }
    
    .admin-section { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 14px; margin-bottom: 16px; }
    .admin-section h3 { font-size: 1rem; margin-bottom: 10px; color: #58a6ff; }
    .user-list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #21262d; }
    .btn-danger { background: #da3633; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .btn-warn { background: #d97706; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }

    #auth-screen { position: fixed; inset: 0; background: #0d1117; display: flex; justify-content: center; align-items: center; z-index: 100; }
    .auth-card { background: #161b22; padding: 24px; border-radius: 12px; border: 1px solid #30363d; width: 90%; max-width: 360px; text-align: center; }
    .auth-card input { width: 100%; margin-bottom: 12px; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; }
    .auth-card button { width: 100%; padding: 10px; background: #2ea44f; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-card">
      <h2 style="margin-bottom: 16px; color: #fff;">MikiConnect</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()">Log In / Sign Up</button>
    </div>
  </div>

  <header>
    <h1>❤️ MIKICONNECT</h1>
    <div class="header-btns">
      <button class="btn-action btn-admin" id="admin-btn" onclick="toggleAdminPanel()">⚡ Dashboard</button>
      <button class="btn-action" onclick="logout()">Log Out</button>
    </div>
  </header>

  <div class="room-bar" id="room-bar">
    <div class="room-tab active" onclick="switchRoom('Global')" id="tab-Global">
      🌐 Global Room <span class="badge" id="badge-Global">0</span>
    </div>
  </div>

  <div id="chat-box"></div>

  <div id="admin-modal">
    <div class="admin-header">
      <h2>🛡️ Admin Dashboard</h2>
      <button class="btn-action" onclick="toggleAdminPanel()">Close ✕</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><h4>Users</h4><p id="stat-users">0</p></div>
      <div class="stat-card"><h4>Online</h4><p id="stat-online">0</p></div>
      <div class="stat-card"><h4>Messages</h4><p id="stat-messages">0</p></div>
    </div>

    <div class="admin-section">
      <h3>Global Actions</h3>
      <button class="btn-danger" style="padding: 8px 14px;" onclick="clearGlobalChat()">🗑️ Clear Global Chat</button>
    </div>

    <div class="admin-section">
      <h3>User Management</h3>
      <div id="admin-user-list">Loading...</div>
    </div>
  </div>

  <footer>
    <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </footer>

  <script>
    const socket = io();
    let currentUser = '';
    let isUserAdmin = false;
    let activeRoom = 'Global';
    const unreadCounts = {};

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) return alert('Enter username and password');

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        currentUser = data.username;
        isUserAdmin = data.isAdmin;
        document.getElementById('auth-screen').style.display = 'none';
        
        if (isUserAdmin) {
          document.getElementById('admin-btn').style.display = 'inline-block';
        }

        socket.emit('register_user', currentUser);
        loadUsers();
        loadMessages();
      } else {
        alert(data.message || 'Login failed');
      }
    }

    function logout() { location.reload(); }

    async function loadUsers() {
      const res = await fetch('/api/users');
      const data = await res.json();
      if (!data.success) return;

      const roomBar = document.getElementById('room-bar');
      roomBar.innerHTML = `
        <div class="room-tab ${activeRoom === 'Global' ? 'active' : ''}" onclick="switchRoom('Global')" id="tab-Global">
          🌐 Global Room <span class="badge ${unreadCounts['Global'] ? 'show' : ''}" id="badge-Global">${unreadCounts['Global'] || 0}</span>
        </div>
      `;

      data.users.forEach(u => {
        if (u.username !== currentUser) {
          const tab = document.createElement('div');
          tab.className = `room-tab ${activeRoom === u.username ? 'active' : ''}`;
          tab.id = `tab-${u.username}`;
          tab.onclick = () => switchRoom(u.username);
          tab.innerHTML = `👤 ${u.username} <span class="badge ${unreadCounts[u.username] ? 'show' : ''}" id="badge-${u.username}">${unreadCounts[u.username] || 0}</span>`;
          roomBar.appendChild(tab);
        }
      });
    }

    function switchRoom(room) {
      activeRoom = room;
      unreadCounts[room] = 0;
      updateBadges();
      
      document.querySelectorAll('.room-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById(`tab-${room}`);
      if (activeTab) activeTab.classList.add('active');
      
      loadMessages();
    }

    function updateBadges() {
      Object.keys(unreadCounts).forEach(room => {
        const badgeEl = document.getElementById(`badge-${room}`);
        if (badgeEl) {
          if (unreadCounts[room] > 0) {
            badgeEl.innerText = unreadCounts[room];
            badgeEl.classList.add('show');
          } else {
            badgeEl.classList.remove('show');
          }
        }
      });
    }

    async function loadMessages() {
      const res = await fetch(`/api/messages?user1=${currentUser}&user2=${activeRoom}`);
      const data = await res.json();
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';

      if (data.success) {
        data.messages.forEach(msg => appendMessage(msg));
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(msg) {
      const chatBox = document.getElementById('chat-box');
      const isSent = msg.sender === currentUser;
      
      const div = document.createElement('div');
      div.className = `message ${isSent ? 'sent' : 'received'}`;
      
      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = `
        ${!isSent ? `<div class="sender">${msg.sender}</div>` : ''}
        <div>${msg.text}</div>
        <div class="time">${timeStr}</div>
      `;
      
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('send_message', { sender: currentUser, receiver: activeRoom, text });
      input.value = '';
    }

    async function toggleAdminPanel() {
      const modal = document.getElementById('admin-modal');
      if (modal.style.display === 'flex') {
        modal.style.display = 'none';
      } else {
        modal.style.display = 'flex';
        fetchAdminData();
      }
    }

    async function fetchAdminData() {
      const res = await fetch('/api/admin/data');
      const data = await res.json();
      if (!data.success) return;

      document.getElementById('stat-users').innerText = data.stats.totalUsers;
      document.getElementById('stat-online').innerText = data.stats.onlineUsers;
      document.getElementById('stat-messages').innerText = data.stats.totalMessages;

      const list = document.getElementById('admin-user-list');
      list.innerHTML = '';
      data.users.forEach(u => {
        const item = document.createElement('div');
        item.className = 'user-list-item';
        item.innerHTML = `
          <span>${u.username} ${u.isAdmin ? '<strong>(Admin)</strong>' : ''}</span>
          <div>
            <button class="btn-warn" onclick="toggleRole('${u.username}')">Role</button>
            <button class="btn-danger" onclick="deleteUser('${u.username}')">Delete</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    async function toggleRole(username) {
      await fetch(`/api/admin/users/${username}/role`, { method: 'PUT' });
      fetchAdminData();
    }

    async function deleteUser(username) {
      if (!confirm(`Delete user ${username}?`)) return;
      await fetch(`/api/admin/users/${username}`, { method: 'DELETE' });
      fetchAdminData();
      loadUsers();
    }

    async function clearGlobalChat() {
      if (!confirm('Are you sure you want to clear all global messages?')) return;
      await fetch('/api/admin/clear-global', { method: 'POST' });
      fetchAdminData();
      if (activeRoom === 'Global') loadMessages();
    }

    socket.on('new_message', (msg) => {
      const isForCurrentRoom = 
        (activeRoom === 'Global' && msg.receiver === 'Global') ||
        (msg.sender === activeRoom && msg.receiver === currentUser) ||
        (msg.sender === currentUser && msg.receiver === activeRoom);

      if (isForCurrentRoom) {
        appendMessage(msg);
      } else {
        const roomKey = msg.receiver === 'Global' ? 'Global' : msg.sender;
        unreadCounts[roomKey] = (unreadCounts[roomKey] || 0) + 1;
        updateBadges();
      }
    });

    socket.on('global_chat_cleared', () => {
      if (activeRoom === 'Global') loadMessages();
    });

    socket.on('user_status_change', () => loadUsers());
  </script>
</body>
</html>
