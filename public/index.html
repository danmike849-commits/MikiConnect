<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect</title>
  <style>
    body { background-color: #121212; color: white; font-family: sans-serif; margin: 0; padding: 0; }
    header { background: #1e1e1e; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .nav-btn { color: #007bff; text-decoration: none; margin-left: 10px; font-weight: bold; }
    .logout-btn { color: #ff4d4d; cursor: pointer; border: none; background: none; font-weight: bold; }
    .container { padding: 20px; }
    .form-group { margin-bottom: 15px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; background: #222; border: 1px solid #444; color: white; border-radius: 4px; }
    button.submit-btn { width: 100%; padding: 10px; background: #007bff; border: none; color: white; font-weight: bold; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h2>MikiConnect</h2>
    <div id="nav-right">
      <a href="/admin.html" id="admin-btn" class="nav-btn" style="display: none;">⚙️ Admin</a>
      <button id="logout-btn" class="logout-btn" style="display: none;" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div id="auth-section">
      <h3>Login / Register</h3>
      <div class="form-group">
        <input type="text" id="username" placeholder="Username">
      </div>
      <div class="form-group">
        <input type="password" id="password" placeholder="Password">
      </div>
      <button class="submit-btn" onclick="handleAuth()">Submit</button>
    </div>

    <div id="app-section" style="display: none;">
      <h3 id="welcome-msg"></h3>
      <p>Welcome to MikiConnect!</p>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    const username = localStorage.getItem('username');

    if (token) {
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('app-section').style.display = 'block';
      document.getElementById('logout-btn').style.display = 'inline-block';
      document.getElementById('welcome-msg').innerText = `Hello, ${username}!`;

      if (role === 'admin') {
        document.getElementById('admin-btn').style.display = 'inline-block';
      }
    }

    async function handleAuth() {
      const userVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('password').value.trim();

      if (!userVal || !passVal) return alert('Fill in all fields');

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: userVal, password: passVal })
      });

      const data = await res.json();

      if (res.ok) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('username', data.username);
        window.location.reload();
      } else {
        alert(data.error || 'Authentication failed');
      }
    }

    function logout() {
      localStorage.clear();
      window.location.reload();
    }
  </script>
</body>
</html>
