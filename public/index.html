<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MikiConnect</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f6f8; color: #333; }
    h1 { text-align: center; color: #007bff; margin-bottom: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .section { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
    textarea, input[type="text"] { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
    button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 5px; }
    button:hover { background: #0056b3; }
    
    /* Post Cards */
    .post-card { background: #fdfdfd; border: 1px solid #e0e0e0; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
    .post-header { display: flex; justify-content: space-between; font-size: 14px; color: #555; }
    .post-content { font-size: 16px; margin: 10px 0; }
    .post-actions { margin-top: 10px; }
    .like-btn { background: #e9ecef; color: #333; width: auto; padding: 6px 12px; font-size: 14px; }
    .like-btn.liked { background: #ff4757; color: white; }
    
    /* Comments */
    .comments-section { margin-top: 10px; background: #f8f9fa; padding: 10px; border-radius: 5px; }
    .comments-list p { margin: 5px 0; font-size: 14px; }
    .comment-input-box { display: flex; gap: 5px; margin-top: 8px; }
    .comment-input-box input { margin: 0; }
    .comment-input-box button { width: auto; margin: 0; font-size: 14px; }
    
    /* Admin */
    ul { list-style: none; padding: 0; }
    li { padding: 8px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <div class="container">
    <h1>MikiConnect</h1>

    <!-- Create Post Area -->
    <div class="section">
      <h3>Create a Post</h3>
      <textarea id="post-content" rows="3" placeholder="What's on your mind?"></textarea>
      <button onclick="createPost()">Publish Post</button>
    </div>

    <!-- Feed Container -->
    <div class="section">
      <h3>Feed</h3>
      <div id="feed-container">
        <p>Loading posts...</p>
      </div>
    </div>

    <!-- Admin Panel -->
    <div class="section">
      <h3>Admin Dashboard</h3>
      <button onclick="loadAdminUsers()">View All Registered Users</button>
      <ul id="admin-user-list"></ul>
    </div>
  </div>

  <!-- Connect JS -->
  <script src="app.js"></script>
</body>
</html>
