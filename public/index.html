<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MikiConnect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000000; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    /* --- AUTH OVERLAY --- */
    #auth-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0f172a; z-index: 99999; display: flex;
      align-items: center; justify-content: center; padding: 20px;
    }
    .auth-card {
      background: #1e293b; padding: 28px 24px; border-radius: 16px;
      width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6); text-align: center; border: 1px solid #334155;
    }
    .auth-card h2 { font-size: 24px; font-weight: 800; color: #ff2a5f; letter-spacing: -0.5px; }
    .auth-card input {
      width: 100%; height: 46px; padding: 0 14px; background: #0f172a;
      color: #fff; border: 1px solid #334155; border-radius: 10px; font-size: 15px; outline: none;
    }
    .auth-card button {
      width: 100%; height: 46px; background: #ff2a5f; color: #fff;
      border: none; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer;
    }

    /* --- MAIN TIKTOK CONTAINER --- */
    #app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; background: #000; }

    /* --- TOP FEED NAVIGATION TABS --- */
    .top-nav {
      position: absolute; top: 0; left: 0; width: 100%; height: 54px;
      display: flex; align-items: center; justify-content: center; gap: 18px;
      z-index: 100; background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 100%);
      font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.6);
    }
    .top-nav .tab { cursor: pointer; transition: all 0.2s; position: relative; padding: 4px 0; }
    .top-nav .tab.active { color: #ffffff; font-weight: 700; font-size: 16px; }
    .top-nav .tab.active::after {
      content: ''; position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
      width: 20px; height: 3px; background-color: #ff2a5f; border-radius: 2px;
    }

    /* --- MAIN FEED VIEW --- */
    .feed-container {
      flex: 1; width: 100%; position: relative; overflow-y: auto; scroll-snap-type: y mandatory;
    }
    .feed-card {
      width: 100%; height: 100%; scroll-snap-align: start; position: relative;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; padding-bottom: 75px;
    }

    /* RIGHT SIDE SOCIAL ACTIONS */
    .side-actions {
      position: absolute; right: 12px; bottom: 120px; display: flex;
      flex-direction: column; align-items: center; gap: 20px; z-index: 90;
    }
    .action-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .action-icon {
      width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center;
      font-size: 20px; transition: transform 0.15s;
    }
    .action-btn:active .action-icon { transform: scale(1.2); }
    .action-count { font-size: 12px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }

    /* POST USER DETAILS OVERLAY */
    .post-info { width: 75%; z-index: 90; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    .post-info .author { font-size: 16px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .post-info .caption { font-size: 14px; line-height: 1.4; color: #e2e8f0; margin-bottom: 8px; }

    /* --- BOTTOM INPUT CHAT BAR --- */
    .chat-input-bar {
      position: absolute; bottom: 56px; left: 0; width: 100%; height: 50px;
      padding: 6px 12px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
      display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100;
    }
    .chat-input-bar input {
      flex: 1; height: 38px; background: #1e293b; border: 1px solid #334155;
      border-radius: 20px; padding: 0 14px; color: #fff; font-size: 14px; outline: none;
    }
    .send-btn {
      width: 38px; height: 38px; border-radius: 50%; background: #ff2a5f;
      border: none; color: #fff; font-weight: bold; font-size: 16px; display: flex;
      align-items: center; justify-content: center; cursor: pointer;
    }

    /* --- BOTTOM TIKTOK NAVIGATION BAR --- */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 56px;
      background: #000000; border-top: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: space-around; z-index: 101;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #94a3b8; font-size: 10px; font-weight: 600; cursor: pointer; }
    .nav-item.active { color: #ffffff; }
    .nav-icon { font-size: 20px; }
    
    /* Central Create (+) Button */
    .create-btn {
      width: 42px; height: 28px; background: #ffffff; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; position: relative; margin: 0 4px;
    }
    .create-btn::before {
      content: ''; position: absolute; left: -3px; width: 14px; height: 100%;
      background: #25f4ee; border-radius: 6px 0 0 6px; z-index: -1;
    }
    .create-btn::after {
      content: ''; position: absolute; right: -3px; width: 14px; height: 100%;
      background: #fe2c55; border-radius: 0 6px 6px 0; z-index: -1;
    }
    .create-btn span { color: #000; font-weight: 900; font-size: 20px; line-height: 1; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>MikiConnect</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button type="button" id="login-btn">Log In / Sign Up</button>
    </div>
  </div>

  <!-- TIKTOK STYLE MAIN CONTAINER -->
  <div id="app-container">

    <!-- TOP CATEGORY TABS -->
    <div class="top-nav">
      <div class="tab">STEM</div>
      <div class="tab">Explore</div>
      <div class="tab">Following</div>
      <div class="tab active">For You</div>
    </div>

    <!-- MAIN FEED ITEM -->
    <div class="feed-container">
      <div class="feed-card">
        
        <!-- SIDE ACTIONS -->
        <div class="side-actions">
          <div class="action-btn" id="heart-action">
            <div class="action-icon">❤️</div>
            <span class="action-count" id="like-count">1.2k</span>
          </div>
          <div class="action-btn">
            <div class="action-icon">💬</div>
            <span class="action-count">342</span>
          </div>
          <div class="action-btn">
            <div class="action-icon">🔖</div>
            <span class="action-count">88</span>
          </div>
          <div class="action-btn">
            <div class="action-icon">🔄</div>
            <span class="action-count">15</span>
          </div>
        </div>

        <!-- POST CAPTION & INFO -->
        <div class="post-info">
          <div class="author">@global_room <span style="font-size:12px; color:#ff2a5f;">✔</span></div>
          <div class="caption">Welcome to MikiConnect Global Feed! Share your ideas, media, and real-time messages worldwide. 🚀❤️</div>
        </div>

      </div>
    </div>

    <!-- INPUT BAR -->
    <div class="chat-input-bar">
      <input type="text" id="chat-msg" placeholder="Type a message...">
      <button class="send-btn" id="send-btn">➔</button>
    </div>

    <!-- TIKTOK BOTTOM NAV BAR -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <div class="nav-icon">🏠</div>
        <span>Home</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon">👥</div>
        <span>Friends</span>
      </div>
      <div class="create-btn">
        <span>+</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon">💬</div>
        <span>Inbox</span>
      </div>
      <div class="nav-item">
        <div class="nav-icon">👤</div>
        <span>Profile</span>
      </div>
    </div>

  </div>

  <script>
    // Login Click Script
    document.getElementById('login-btn').addEventListener('click', () => {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if (u && p) {
        localStorage.setItem('username', u);
        document.getElementById('auth-screen').style.display = 'none';
      } else {
        alert('Please fill in both fields.');
      }
    });

    // Like Heart Counter Interactive Animation
    let liked = false;
    let count = 1200;
    document.getElementById('heart-action').addEventListener('click', () => {
      liked = !liked;
      count = liked ? count + 1 : count - 1;
      document.getElementById('like-count').textContent = count > 1000 ? (count/1000).toFixed(1) + 'k' : count;
    });
  </script>
</body>
</html>
