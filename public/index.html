 <title>MikiConnect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background-color: #161b22; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; flex-shrink: 0; }
    header h1 { font-size: 1.05rem; color: #2ea44f; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .header-btns { display: flex; gap: 6px; }
    .btn-action { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
    .btn-admin { background: #d97706; color: #fff; border: none; font-weight: bold; display: none; }
    
    .chat-header { background: #161b22; padding: 8px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #30363d; flex-shrink: 0; }
    .chat-header .avatar { width: 34px; height: 34px; background: #1f6feb; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.95rem; flex-shrink: 0; }
    .chat-header .user-info { display: flex; flex-direction: column; overflow: hidden; }
    .chat-header .username { font-size: 0.9rem; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-header .status { font-size: 0.72rem; color: #8b949e; white-space: nowrap; }
    .chat-header .status.online { color: #2ea44f; }
    .chat-header .status.typing { color: #58a6ff; font-style: italic; }

    .room-bar { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; background-color: #0d1117; border-bottom: 1px solid #30363d; flex-shrink: 0; }
    .room-tab { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 5px 12px; border-radius: 16px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 4px; font-size: 0.8rem; }
    .room-tab.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
    
    .badge { background-color: #2ea44f; color: white; font-size: 0.65rem; font-weight: bold; padding: 1px 5px; border-radius: 10px; display: none; }
    .badge.show { display: inline-block; }

    #chat-box { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .message { max-width: 82%; padding: 8px 12px; border-radius: 10px; font-size: 0.88rem; line-height: 1.35; word-break: break-word; position: relative; cursor: pointer; }
    .message.received { background: #21262d; align-self: flex-start; border-bottom-left-radius: 2px; }
    .message.sent { background: #0b84ff; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .message img { max-width: 100%; border-radius: 8px; margin-top: 4px; display: block; }

    .quoted-box { background: rgba(0, 0, 0, 0.25); border-left: 3px solid #2ea44f; padding: 3px 6px; border-radius: 4px; margin-bottom: 4px; font-size: 0.75rem; opacity: 0.9; }
    .message .time-container { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 2px; }
    .message .time { font-size: 0.62rem; opacity: 0.75; }
    .message .ticks { font-size: 0.72rem; font-weight: bold; }
    .message .ticks.read { color: #58a6ff; }
    .message .ticks.unread { color: #8b949e; }
    .edited-label { font-size: 0.62rem; opacity: 0.7; font-style: italic; margin-right: 4px; }

    #admin-modal, #action-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 200; padding: 16px; }
    .modal-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; width: 100%; max-width: 340px; max-height: 80vh; display: flex; flex-direction: column; overflow: hidden; padding: 16px; }
    .admin-list-container { flex: 1; overflow-y: auto; margin: 12px 0; padding-right: 4px; }
    .admin-user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #21262d; font-size: 0.88rem; }
    .admin-user-row:last-child { border-bottom: none; }
    .btn-delete { background: #da3633; color: #fff; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.78rem; font-weight: bold; }

    .action-item { padding: 12px 16px; border-bottom: 1px solid #21262d; color: #c9d1d9; cursor: pointer; font-size: 0.9rem; }
    .action-item.danger { color: #da3633; }

    #reply-banner { background: #161b22; padding: 6px 12px; border-top: 1px solid #30363d; display: none; justify-content: space-between; align-items: center; font-size: 0.78rem; flex-shrink: 0; }
    #reply-banner button { background: none; border: none; color: #da3633; cursor: pointer; font-size: 0.95rem; }

    footer { padding: 10px; background: #161b22; border-top: 1px solid #30363d; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    input[type="text"] { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 10px 14px; border-radius: 20px; outline: none; font-size: 0.9rem; }
    .file-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 10px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; }
    button.send-btn { background: #0b84ff; color: white; border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; flex-shrink: 0; }

    #auth-screen { position: fixed; inset: 0; background: #0d1117; display: flex; justify-content: center; align-items: center; z-index: 100; }
    .auth-card { background: #161b22; padding: 24px; border-radius: 12px; border: 1px solid #30363d; width: 90%; max-width: 360px; text-align: center; }
    .auth-card input { width: 100%; margin-bottom: 12px; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; }
    .auth-card button { width: 100%; padding: 10px; background: #2ea44f; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

<body><!-- TikTok Style Layout -->
<div class="tiktok-container">
  <div class="top-nav">
    <span>STEM</span>
    <span>Explore</span>
    <span>Following</span>
    <span class="active">For You</span>
  </div>

  <div class="feed-content" id="feedContent">
    <div class="side-actions">
      <div class="action-btn"><i>❤️</i><span>1.3K</span></div>
      <div class="action-btn"><i>💬</i><span>128</span></div>
      <div class="action-btn"><i>↪️</i><span>5</span></div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active"><span class="icon">🏠</span><span>Home</span></div>
    <div class="nav-item"><span class="icon">👥</span><span>Friends</span></div>
    <div class="nav-item add-btn"><span>+</span></div>
    <div class="nav-item"><span class="icon">💬</span><span>Inbox</span></div>
    <div class="nav-item"><span class="icon">👤</span><span>Profile</span></div>
  </div>
</div>


  <div id="auth-screen">
    <div class="auth-card">
      <h2 style="margin-bottom: 16px; color: #fff;">MikiConnect</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()">Log In / Sign Up</button>
    </div>
  </div>

  
    <div class="header-btns">
      <button class="btn-action btn-admin" id="admin-btn" onclick="openAdminPanel()">⚡ Dashboard</button>
      <button class="btn-action" onclick="logout()">Log Out</button>
    </div>
  </header>

  <div class="room-bar" id="room-bar">
    <div class="room-tab active" onclick="switchRoom('Global')" id="tab-Global">🌐 Global</div>
  </div>

  <div class="chat-header" id="chat-header">
    <div class="avatar" id="header-avatar">🌐</div>
    <div class="user-info">
      <div class="username" id="header-title">Global Room</div>
      <div class="status" id="header-status">Visible to everyone online</div>
    </div>
  </div>

  <div id="chat-box"></div>

  <div id="reply-banner">
    <div><span id="banner-action-type">Replying to</span>: <strong id="reply-user"></strong> - <span id="reply-text"></span></div>
    <button onclick="cancelReply()">✕</button>
  </div>

  <footer>
    <label class="file-btn" for="img-input">📷</label>
    <input type="file" id="img-input" accept="image/*" style="display:none" onchange="handleImageSelect(event)">
    <input type="text" id="msg-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()" oninput="notifyTyping()">
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </footer>

  <div id="admin-modal" onclick="closeAdminPanel()">
    <div class="modal-card" onclick="event.stopPropagation()">
      <h3 style="color:#fff; border-bottom: 1px solid #30363d; padding-bottom: 8px;">⚡ Admin Dashboard</h3>
      <div id="admin-user-list" class="admin-list-container"></div>
      <button onclick="closeAdminPanel()" style="width: 100%; padding: 10px; background: #21262d; border: 1px solid #30363d; color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold;">Close</button>
    </div>
  </div>

  <div id="action-modal" onclick="closeActionModal()">
    <div class="modal-card" style="padding:0;" onclick="event.stopPropagation()">
      <div class="action-item" onclick="copyMessage()">📋 Copy Text</div>
      <div class="action-item" onclick="triggerReplySelected()">💬 Reply</div>
      <div class="action-item" id="edit-opt" onclick="startEditMessage()">✏️ Edit Message</div>
      <div class="action-item danger" id="delete-opt" onclick="deleteSelectedMessage()">🗑️ Delete</div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = '';
    let isUserAdmin = false;
    let activeRoom = 'Global';
    let replyTarget = null;
    let selectedMsg = null;
    let editingMsgId = null;
    let selectedImageData = null;
    let usersList = [];
    let typingTimeout = null;
async function login() {
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');

  const username = usernameInput ? usernameInput.value.trim() : '';
  const password = passwordInput ? passwordInput.value.trim() : '';

  if (!username || !password) {
    alert('Please fill in both fields.');
    return;
  }

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.ok) {
  localStorage.setItem('mikiconnect_token', data.token);
  document.getElementById('auth-screen').style.display = 'none';
  alert('Welcome back!');
  window.location.reload();
} else {

      alert(data.error || 'Login failed');
    }
  } catch (err) {
    console.error(err);
    alert('Network error connecting to backend.');
  }
}

    window.onload = async () => {
      const token = localStorage.getItem('mikiconnect_token');
      if (token) {
        const res = await fetch('/api/verify', { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (data.success) {
          currentUser = data.user.username;
          isUserAdmin = data.user.isAdmin;
          document.getElementById('auth-screen').style.display = 'none';
          if (isUserAdmin) document.getElementById('admin-btn').style.display = 'inline-block';
          socket.emit('register_user', currentUser);
          loadUsers();
          loadMessages();
        }
      }
    };

    async function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) return alert('Enter username and password');

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        localStorage.setItem('mikiconnect_token', data.token);
        currentUser = data.username;
        isUserAdmin = data.isAdmin;
        document.getElementById('auth-screen').style.display = 'none';
        
        if (isUserAdmin) document.getElementById('admin-btn').style.display = 'inline-block';

        socket.emit('register_user', currentUser);
        loadUsers();
        loadMessages();
      } else {
        alert(data.message || 'Login failed');
      }
    }

    function logout() { 
      localStorage.removeItem('mikiconnect_token');
      location.reload(); 
    }

    async function openAdminPanel() {
      const token = localStorage.getItem('mikiconnect_token');
      const res = await fetch('/api/admin/users', { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      if (!data.success) return alert(data.message || 'Admin access denied');

      const listEl = document.getElementById('admin-user-list');
      listEl.innerHTML = data.users.map(u => `
        <div class="admin-user-row">
          <span>${u.username} ${u.isAdmin ? '⚡' : ''}</span>
          ${u.username !== currentUser ? `<button class="btn-delete" onclick="deleteUserByAdmin('${u.username}')">Delete</button>` : '<span style="font-size:0.75rem; color:#8b949e;">You</span>'}
        </div>
      `).join('');

      document.getElementById('admin-modal').style.display = 'flex';
    }

    function closeAdminPanel() {
      document.getElementById('admin-modal').style.display = 'none';
    }

    async function deleteUserByAdmin(username) {
      if (!confirm(`Delete user ${username}?`)) return;
      const token = localStorage.getItem('mikiconnect_token');
      await fetch(`/api/admin/users/${username}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
      openAdminPanel();
    }

    async function loadUsers() {
      const res = await fetch(`/api/users?currentUser=${currentUser}`);
      const data = await res.json();
      if (!data.success) return;

      usersList = data.users;
      const roomBar = document.getElementById('room-bar');
      roomBar.innerHTML = `<div class="room-tab ${activeRoom === 'Global' ? 'active' : ''}" onclick="switchRoom('Global')" id="tab-Global">🌐 Global</div>`;

      usersList.forEach(u => {
        if (u.username !== currentUser) {
          const tab = document.createElement('div');
          tab.className = `room-tab ${activeRoom === u.username ? 'active' : ''}`;
          tab.id = `tab-${u.username}`;
          tab.onclick = () => switchRoom(u.username);
          tab.innerHTML = `👤 ${u.username} <span class="badge ${u.unreadCount > 0 ? 'show' : ''}" id="badge-${u.username}">${u.unreadCount}</span>`;
          roomBar.appendChild(tab);
        }
      });

      updateHeaderStatus();
    }

    function updateHeaderStatus(isTyping = false) {
      const statusEl = document.getElementById('header-status');
      if (activeRoom === 'Global') {
        document.getElementById('header-avatar').innerText = '🌐';
        document.getElementById('header-title').innerText = 'Global Public Chat';
        statusEl.className = 'status';
        statusEl.innerText = isTyping ? 'someone is typing...' : 'Visible to everyone online';
      } else {
        const u = usersList.find(x => x.username === activeRoom);
        document.getElementById('header-avatar').innerText = activeRoom[0].toUpperCase();
        document.getElementById('header-title').innerText = activeRoom;
        
        if (isTyping) {
          statusEl.className = 'status typing';
          statusEl.innerText = 'typing...';
        } else if (u && u.isOnline) {
          statusEl.className = 'status online';
          statusEl.innerText = 'online';
        } else if (u && u.lastSeen) {
          statusEl.className = 'status';
          const time = new Date(u.lastSeen).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          statusEl.innerText = `last seen today at ${time}`;
        } else {
          statusEl.className = 'status';
          statusEl.innerText = 'offline';
        }
      }
    }

    function switchRoom(room) {
      activeRoom = room;
      document.querySelectorAll('.room-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById(`tab-${room}`);
      if (activeTab) activeTab.classList.add('active');

      const badge = document.getElementById(`badge-${room}`);
      if (badge) badge.classList.remove('show');
      
      updateHeaderStatus();
      loadMessages();
    }

    async function loadMessages() {
      const res = await fetch(`/api/messages?user1=${currentUser}&user2=${activeRoom}`);
      const data = await res.json();
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML = '';

      if (data.success) {
        data.messages.forEach(msg => appendMessage(msg));
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function appendMessage(msg) {
      const chatBox = document.getElementById('chat-box');
      const isSent = msg.sender === currentUser;
      
      const div = document.createElement('div');
      div.className = `message ${isSent ? 'sent' : 'received'}`;
      div.id = `msg-${msg._id}`;
      div.onclick = () => openActionModal(msg);

      let replyHtml = msg.replyTo ? `<div class="quoted-box"><strong>${msg.replyTo.sender}</strong>: ${msg.replyTo.text || '[Image]'}</div>` : '';
      let imageHtml = msg.image ? `<img src="${msg.image}" />` : '';
      let textHtml = msg.text ? `<div>${msg.text}</div>` : '';

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const ticksHtml = isSent ? `<span class="ticks ${msg.read ? 'read' : 'unread'}">${msg.read ? '✓✓' : '✓'}</span>` : '';

      div.innerHTML = `
        ${replyHtml}
        ${!isSent && activeRoom === 'Global' ? `<div style="font-size:0.75rem; font-weight:bold; color:#58a6ff; margin-bottom:2px;">${msg.sender}</div>` : ''}
        ${imageHtml}
        ${textHtml}
        <div class="time-container">
          ${msg.isEdited ? `<span class="edited-label">edited</span>` : ''}
          <span class="time">${timeStr}</span>
          ${ticksHtml}
        </div>
      `;
      
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function openActionModal(msg) {
      selectedMsg = msg;
      const isSent = msg.sender === currentUser;
      document.getElementById('edit-opt').style.display = isSent ? 'block' : 'none';
      document.getElementById('delete-opt').style.display = (isSent || isUserAdmin) ? 'block' : 'none';
      document.getElementById('action-modal').style.display = 'flex';
    }

    function closeActionModal() {
      document.getElementById('action-modal').style.display = 'none';
    }

    function copyMessage() {
      if (selectedMsg && selectedMsg.text) navigator.clipboard.writeText(selectedMsg.text);
      closeActionModal();
    }

    function triggerReplySelected() {
      replyTarget = { sender: selectedMsg.sender, text: selectedMsg.text };
      document.getElementById('banner-action-type').innerText = 'Replying to';
      document.getElementById('reply-user').innerText = selectedMsg.sender;
      document.getElementById('reply-text').innerText = (selectedMsg.text || '[Image]').substring(0, 30);
      document.getElementById('reply-banner').style.display = 'flex';
      closeActionModal();
    }

    function startEditMessage() {
      editingMsgId = selectedMsg._id;
      document.getElementById('msg-input').value = selectedMsg.text || '';
      document.getElementById('banner-action-type').innerText = 'Editing message';
      document.getElementById('reply-user').innerText = 'You';
      document.getElementById('reply-text').innerText = (selectedMsg.text || '').substring(0, 30);
      document.getElementById('reply-banner').style.display = 'flex';
      closeActionModal();
    }

    async function deleteSelectedMessage() {
      if (!confirm('Delete this message?')) return;
      await fetch(`/api/messages/${selectedMsg._id}`, { method: 'DELETE' });
      closeActionModal();
    }

    function cancelReply() {
      replyTarget = null;
      editingMsgId = null;
      selectedImageData = null;
      document.getElementById('msg-input').value = '';
      document.getElementById('reply-banner').style.display = 'none';
    }

    function notifyTyping() {
      socket.emit('typing', { sender: currentUser, receiver: activeRoom });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('stop_typing', { sender: currentUser, receiver: activeRoom });
      }, 2000);
    }

    function handleImageSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        selectedImageData = evt.target.result;
        document.getElementById('banner-action-type').innerText = 'Attaching image';
        document.getElementById('reply-user').innerText = 'Photo';
        document.getElementById('reply-text').innerText = file.name;
        document.getElementById('reply-banner').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();

      if (editingMsgId) {
        if (!text) return;
        await fetch(`/api/messages/${editingMsgId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        cancelReply();
        return;
      }

      if (!text && !selectedImageData) return;

      const payload = {
        sender: currentUser,
        receiver: activeRoom,
        text: text,
        image: selectedImageData,
        replyTo: replyTarget
      };

      socket.emit('send_message', payload);
      cancelReply();
    }

    socket.on('new_message', (msg) => {
      const isForCurrentRoom = 
        (activeRoom === 'Global' && msg.receiver === 'Global') ||
        (msg.sender === activeRoom && msg.receiver === currentUser) ||
        (msg.sender === currentUser && msg.receiver === activeRoom);

      if (isForCurrentRoom) appendMessage(msg);
      else loadUsers();
    });

    socket.on('message_updated', () => loadMessages());
    socket.on('message_deleted', (msgId) => {
      const el = document.getElementById(`msg-${msgId}`);
      if (el) el.remove();
    });

    socket.on('user_typing', (data) => {
      if ((activeRoom === 'Global' && data.receiver === 'Global') || data.sender === activeRoom) updateHeaderStatus(true);
    });

    socket.on('user_stop_typing', (data) => {
      if ((activeRoom === 'Global' && data.receiver === 'Global') || data.sender === activeRoom) updateHeaderStatus(false);
    });

    socket.on('messages_read', () => { if (activeRoom !== 'Global') loadMessages(); });
    socket.
  // 1. Bottom Navigation Tabs Switcher
  const navItems = document.querySelectorAll('.bottom-nav .nav-item');
  navItems.forEach(item => {
    item.addEventListener('click', () => {
      navItems.forEach(nav => nav.classList.remove('active'));
      item.classList.add('active');

      const tabName = item.querySelector('span:last-child')?.innerText || 'Action';
      console.log(`Navigated to: ${tabName}`);
    });
  });

  // 2. Top Feed Filter Tabs Switcher
  const topNavSpans = document.querySelectorAll('.top-nav span');
  topNavSpans.forEach(span => {
    span.addEventListener('click', () => {
      topNavSpans.forEach(tab => tab.classList.remove('active'));
      span.classList.add('active');
      console.log(`Feed switched to: ${span.innerText}`);
    });
  });

  // 3. Heart / Like Button Toggle
  const likeBtn = document.querySelector('.action-btn:nth-child(1)');
  if (likeBtn) {
    likeBtn.addEventListener('click', () => {
      const heartIcon = likeBtn.querySelector('i');
      const countSpan = likeBtn.querySelector('span');

      if (likeBtn.classList.contains('liked')) {
        likeBtn.classList.remove('liked');
        heartIcon.style.color = '#fff';
        countSpan.innerText = '1.3K';
      } else {
        likeBtn.classList.add('liked');
        heartIcon.style.color = '#fe2c55';
        countSpan.innerText = '1.4K';
      }
    });
  }

  // 4. Action Buttons (Comments & Share)
  const commentBtn = document.querySelector('.action-btn:nth-child(2)');
  if (commentBtn) {
    commentBtn.addEventListener('click', () => {
      alert('Opening comments drawer...');
    });
  }

  const shareBtn = document.querySelector('.action-btn:nth-child(3)');
  if (shareBtn) {
    shareBtn.addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({
          title: 'MikiConnect',
          text: 'Check out this post on MikiConnect!',
          url: window.location.href,
        }).catch(() => {});
      } else {
        alert('Post link copied to clipboard!');
      }
    });
  }

  // 5. Create (+ Button) Trigger
  const addBtn = document.querySelector('.add-btn');
  if (addBtn) {
    addBtn.addEventListener('click', () => {
      alert('Opening post creator / upload modal...');
    });
  }
  socket.on('user_status_change', () => loadUsers());
</script>
