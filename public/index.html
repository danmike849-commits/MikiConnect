<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikiConnect</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #121417; color: #fff; font-family: sans-serif; }
        .header { background: #25282c; padding: 15px; text-align: center; border-bottom: 1px solid #333; }
        .header h1 { margin: 0; color: #40c057; font-size: 22px; }
        .nav-bar { display: flex; background: #1c1e22; border-bottom: 2px solid #333; overflow-x: auto; }
        .nav-bar button { flex: 1; padding: 12px; background: none; border: none; color: #888; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; min-width: 70px; }
        .nav-bar button.active { color: #40c057; border-bottom-color: #40c057; }
        .tab-content { padding: 15px; display: none; }
        .tab-content.active { display: block; }
        .card { background: #25282c; border-radius: 8px; padding: 15px; border: 1px solid #333; margin-bottom: 15px; }
        input, button { font-family: inherit; }
    </style>
</head>
<body>

    <div class="header">
        <h1>MikiConnect</h1>
    </div>

    <div class="nav-bar">
        <button id="nav-feed" class="active" onclick="switchTab('feed')">Feed</button>
        <button id="nav-dm" onclick="switchTab('dm')">1-on-1 Chat</button>
        <button id="nav-chat" onclick="switchTab('chat')">Live Chat</button>
        <button id="nav-groups" onclick="switchTab('groups')">Groups</button>
        <button id="nav-admin" style="display: none;" onclick="switchTab('admin')">Admin</button>
        <button id="nav-account" onclick="switchTab('account')">Account</button>
    </div>

    <!-- FEED TAB -->
    <div id="feed-tab" class="tab-content active">
        <div class="card">
            <h3 style="margin-top:0;">Create Post</h3>
            <textarea id="post-input" placeholder="What's on your mind?" style="width: 100%; height: 60px; background: #181a1d; border: 1px solid #444; color: #fff; border-radius: 4px; padding: 8px; box-sizing: border-box;"></textarea>
            <button onclick="createPost()" style="width: 100%; background: #40c057; color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: bold; margin-top: 8px; cursor: pointer;">Post</button>
        </div>
        <div id="feed-posts"></div>
    </div>

    
    <!-- 1-ON-1 PRIVATE CHAT TAB -->
    <div id="dm-tab" class="tab-content">
        <div class="card">
            <h3 style="margin-top:0; color:#40c057;">1-on-1 Direct Messages</h3>
            
            <!-- PENDING REQUESTS CONTAINER -->
            <div id="dm-requests-container" style="display:none; background:#181a1d; padding:10px; border-radius:6px; border:1px solid #339af0; margin-bottom:12px;">
                <h4 style="margin:0 0 8px 0; color:#339af0; font-size:13px;">Pending Chat Requests</h4>
                <div id="dm-requests-list"></div>
            </div>

            <!-- CONVERSATIONS LIST -->
            <div id="dm-conv-list" style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px;"></div>
        </div>

        <!-- PRIVATE MESSAGING ROOM (HIDDEN UNTIL CONVERSATION OPENED) -->
        <div id="dm-chat-room" class="card" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #333; padding-bottom:8px; margin-bottom:10px;">
                <button onclick="closeDMChat()" style="background:#333; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; font-size:12px;">← Back</button>
                <span id="dm-partner-name" style="font-weight:bold; color:#40c057;">@User</span>
            </div>

            <!-- MESSAGES CONTAINER -->
            <div id="dm-messages-display" style="height:280px; overflow-y:auto; background:#181a1d; padding:10px; border-radius:6px; border:1px solid #333; display:flex; flex-direction:column; gap:8px; margin-bottom:10px;"></div>

            <!-- MEDIA & VOICE CONTROLS -->
            <div style="display:flex; gap:6px; margin-bottom:8px;">
                <input type="file" id="dm-file-input" accept="image/*,video/*" style="display:none;" onchange="handleMediaUpload(this)" />
                <button onclick="document.getElementById('dm-file-input').click()" style="background:#2b5235; color:#40c057; border:1px solid #40c057; padding:6px 10px; border-radius:4px; font-size:12px; cursor:pointer;">📁 Photo/Video</button>
                
                <button id="dm-mic-btn" onclick="toggleVoiceRecording()" style="background:#1e3a24; color:#40c057; border:1px solid #40c057; padding:6px 10px; border-radius:4px; font-size:12px; cursor:pointer;">🎤 Record Voice</button>
            </div>

            <!-- TEXT INPUT & SEND -->
            <div style="display:flex; gap:6px;">
                <input type="text" id="dm-msg-input" placeholder="Type a private message..." style="flex:1; padding:10px; background:#181a1d; border:1px solid #444; color:#fff; border-radius:4px; box-sizing:border-box;" />
                <button onclick="sendPrivateMessage()" style="background:#40c057; color:#fff; border:none; padding:10px 15px; border-radius:4px; font-weight:bold; cursor:pointer;">Send</button>
            </div>
        </div>
    </div>

    <!-- CHAT TAB -->
    <div id="chat-tab" class="tab-content">
        <div class="card">
            <h3 style="margin-top: 0;">Live Community Chat</h3>
            <div id="chat-messages" style="height: 300px; overflow-y: auto; background: #181a1d; padding: 10px; border-radius: 6px; border: 1px solid #333; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px;"></div>
            <input type="text" id="chat-msg-input" placeholder="Type a message..." style="width: 100%; padding: 10px; background: #181a1d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; margin-bottom: 6px;" />
            <input type="text" id="chat-img-input" placeholder="Image URL (optional)" style="width: 100%; padding: 8px; background: #181a1d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; margin-bottom: 8px; font-size: 12px;" />
            <button onclick="sendChatMessage()" style="width: 100%; background: #40c057; color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">Send Message</button>
        </div>
    </div>

    <!-- GROUPS TAB -->
    <div id="groups-tab" class="tab-content">
        <div class="card" style="text-align: center;">
            <h3>Community Groups</h3>
            <p style="color: #aaa;">Group channels coming soon!</p>
        </div>
    </div>

    <!-- ADMIN TAB -->
    <div id="admin-tab" class="tab-content">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0;">Analytics Overview</h3>
                <span id="admin-total-users" style="background: #2b5235; color: #40c057; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;">0 Users</span>
            </div>
            <div style="background: #181a1d; padding: 10px; border-radius: 6px; border: 1px solid #333; margin-bottom: 15px;">
                <canvas id="adminStatsChart" style="max-height: 200px; width: 100%;"></canvas>
            </div>
            <button onclick="loadAdminData()" style="width: 100%; background: #40c057; color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">Refresh Dashboard</button>
        </div>
        <div class="card">
            <h4 style="margin-top: 0;">Registered Accounts</h4>
            <div id="admin-users-display" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
    </div>

    <!-- ACCOUNT TAB -->
    
    <!-- ACCOUNT TAB -->
    
    <!-- ACCOUNT TAB -->
    <div id="account-tab" class="tab-content">
        <!-- LOGGED IN USER PROFILE CARD -->
        <div id="user-profile-card" class="card" style="display:none; text-align:center; padding:20px;">
            <div style="font-size:50px; margin-bottom:10px;">👤</div>
            <h3 id="user-display-name" style="margin:5px 0; color:#40c057;">@User</h3>
            <p style="color:#888; font-size:12px; margin-bottom:20px;">Logged in to MikiConnect</p>
            <button onclick="logoutUser()" style="background:#e03131; color:#fff; border:none; padding:12px 20px; border-radius:6px; font-weight:bold; cursor:pointer; width:100%;">Log Out</button>
        </div>

        <!-- LOGGED OUT AUTH FORM -->
        <div id="auth-container" class="card" style="display:block;">
            <h3 id="auth-title" style="margin-top:0; color:#40c057;">Login</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <input type="text" id="auth-username" placeholder="Username or Email" style="padding:10px; background:#181a1d; border:1px solid #444; color:#fff; border-radius:4px;" />
                <input type="password" id="auth-password" placeholder="Password" style="padding:10px; background:#181a1d; border:1px solid #444; color:#fff; border-radius:4px;" />
                <button id="auth-submit-btn" onclick="handleAuthSubmit()" style="background:#40c057; color:#fff; border:none; padding:12px; border-radius:4px; font-weight:bold; cursor:pointer;">Login</button>
            </div>
            <p style="text-align:center; font-size:12px; margin-top:15px; color:#aaa;">
                <span id="auth-toggle-text">Need an account?</span> 
                <a href="#" onclick="toggleAuthMode(); return false;" style="color:#40c057; text-decoration:underline;" id="auth-toggle-link">Register here</a>
            </p>
        </div>
    </div>



    <script src="app.js?v=1786547175556"></script>
</body>
</html>
