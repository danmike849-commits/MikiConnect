// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        jcenter()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}


// Auto-patch aapt2 binaries extracted by gradle transforms
tasks.configureEach { task ->
    task.doFirst {
        try {
            def cacheDir = new File(System.getProperty("user.home"), ".gradle/caches")
            if (cacheDir.exists()) {
                cacheDir.eachFileRecurse { file ->
                    if (file.name == "aapt2" && file.isFile() && !file.absolutePath.contains("usr/bin")) {
                        if (!file.text.contains("nativeAapt2Wrapper")) {
                            file.text = "#!/data/data/com.termux/files/usr/bin/sh\n# nativeAapt2Wrapper\nexec /data/data/com.termux/files/usr/bin/aapt2 \"\$@\""
                            file.setExecutable(true, false)
                        }
                    }
                }
            }
        } catch (e) {
            // ignore
        }
    }
}
