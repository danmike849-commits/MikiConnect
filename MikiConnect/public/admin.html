<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MikiConnect Admin</title><style>body{font-family:system-ui;background:#0b1020;color:#eef2ff;max-width:1000px;margin:auto;padding:20px}.card{background:#151c2f;border:1px solid #29334d;border-radius:14px;padding:18px;margin:14px 0}button,input{padding:10px;border-radius:8px;border:1px solid #394564}input{background:#0f1526;color:#fff;width:60%}button{background:#4f7cff;color:#fff;cursor:pointer;margin:3px}.danger{background:#c73f57}.muted{color:#9aa7c2}.error{color:#ff9ca9}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><h1>MikiConnect Admin</h1><p><a href="/" style="color:#8da8ff">← Back to app</a></p><div id="status">Checking authorization…</div><div id="stats" class="card"></div><div class="card"><h2>Broadcast</h2><div class="row"><input id="broadcast" maxlength="2000" placeholder="System announcement"><button id="send">Send</button></div></div><div class="card"><h2>Users</h2><button id="refresh">Refresh</button><div id="users"></div></div><div class="card"><h2>Open reports</h2><button id="reportsRefresh">Refresh reports</button><div id="reports"></div></div><script>
const token=localStorage.getItem('token');const statusEl=document.getElementById('status');async function api(path,options={}){const headers={...(options.headers||{}),Authorization:`Bearer ${token}`};const r=await fetch(path,{...options,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}async function init(){if(!token){location.href='/';return}try{const me=await api('/api/me');if(me.user.role!=='admin')throw new Error('Admin access required.');statusEl.textContent='Signed in as @'+me.user.username;load();loadReports()}catch(e){statusEl.className='error';statusEl.textContent=e.message;setTimeout(()=>location.href='/',900)}}async function load(){try{const [s,u]=await Promise.all([api('/api/admin/stats'),api('/api/admin/users')]);document.getElementById('stats').innerHTML=`<strong>Users:</strong> ${s.totalUsers} &nbsp; <strong>Posts:</strong> ${s.totalPosts} &nbsp; <strong>Messages:</strong> ${s.totalMessages} &nbsp; <strong>Banned:</strong> ${s.bannedUsers} &nbsp; <strong>Live sockets:</strong> ${s.activeSockets}`;document.getElementById('users').innerHTML=u.users.map(x=>`<div class="row" style="padding:10px 0;border-top:1px solid #29334d"><span style="min-width:220px"><strong>@${x.username}</strong> — ${x.role}${x.isBanned?' — banned':''}</span><button data-role="${x.username}" data-value="${x.role==='admin'?'user':'admin'}">Make ${x.role==='admin'?'user':'admin'}</button><button class="danger" data-ban="${x.username}" data-value="${!x.isBanned}">${x.isBanned?'Unban':'Ban'}</button><button class="danger" data-del="${x.username}">Delete</button></div>`).join('')}catch(e){statusEl.textContent=e.message}}document.getElementById('send').onclick=async()=>{const message=document.getElementById('broadcast').value.trim();if(!message)return;try{await api('/api/admin/broadcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});document.getElementById('broadcast').value='';alert('Broadcast sent.')}catch(e){alert(e.message)}};document.getElementById('refresh').onclick=load;async function loadReports(){try{const d=await api('/api/admin/reports');document.getElementById('reports').innerHTML=d.reports.map(r=>`<div style="padding:10px 0;border-top:1px solid #29334d"><strong>${r.targetType}</strong> <code>${r.targetId}</code><div>${String(r.reason).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}</div><div class="muted">reported by @${r.reporter} · ${new Date(r.createdAt).toLocaleString()}</div><button data-resolve="${r._id}">Resolve</button><button data-dismiss="${r._id}" class="danger">Dismiss</button></div>`).join('')||'<span class="muted">No open reports.</span>'}catch(e){document.getElementById('reports').textContent=e.message}};document.getElementById('reportsRefresh').onclick=loadReports;document.getElementById('reports').onclick=async e=>{const r=e.target.closest('[data-resolve]')||e.target.closest('[data-dismiss]');if(!r)return;const status=r.dataset.resolve?'resolved':'dismissed';try{await api('/api/admin/reports/'+r.dataset[status==='resolved'?'resolve':'dismiss'],{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadReports()}catch(x){alert(x.message)}};
document.getElementById('users').onclick=async e=>{try{const role=e.target.closest('[data-role]'),ban=e.target.closest('[data-ban]'),del=e.target.closest('[data-del]');if(role)await api('/api/admin/users/role',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:role.dataset.role,role:role.dataset.value})});if(ban)await api('/api/admin/users/ban',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:ban.dataset.ban,isBanned:ban.dataset.value==='true'})});if(del&&confirm('Delete user and their content?'))await api('/api/admin/users/'+encodeURIComponent(del.dataset.del),{method:'DELETE'});load()}catch(x){alert(x.message)}};init();
</script></body></html>
