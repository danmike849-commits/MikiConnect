<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MikiConnect Admin Control Panel</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#0b1020;color:#eef2ff;max-width:1100px;margin:auto;padding:18px}.card{background:#151c2f;border:1px solid #29334d;border-radius:14px;padding:18px;margin:14px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{padding:12px 0;border-top:1px solid #29334d}.muted{color:#9aa7c2}.error{color:#ff9ca9}.ok{color:#8ee0a8}.danger{background:#c73f57!important}button,input,select{padding:10px;border-radius:8px;border:1px solid #394564;font:inherit}input,select{background:#0f1526;color:#fff}input{width:min(100%,420px)}button{background:#4f7cff;color:#fff;cursor:pointer}.small{font-size:.88rem}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{background:#0f1526;border-radius:10px;padding:12px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}code{word-break:break-all}</style></head><body>
<div class="top"><div><h1>MikiConnect Admin Control Panel</h1><p class="muted">Moderation and platform operations</p></div><a href="/" style="color:#9bb2ff">← Back to app</a></div>
<div id="status" class="card">Checking authorization…</div>
<div id="stats" class="card stats"></div>
<div class="card"><h2>System broadcast</h2><p class="muted small">Sends a live announcement to connected users.</p><div class="row"><input id="broadcast" maxlength="2000" placeholder="System announcement"><button id="send">Send broadcast</button></div></div>
<div class="card"><div class="top"><h2>Users</h2><button id="refreshUsers">Refresh</button></div><div class="row"><input id="userSearch" maxlength="50" placeholder="Search username or email"><button id="searchUsers">Search</button></div><div id="users"></div></div>
<div class="card"><div class="top"><h2>Reports</h2><div class="row"><select id="reportStatus"><option value="open">Open</option><option value="resolved">Resolved</option><option value="dismissed">Dismissed</option></select><button id="refreshReports">Refresh</button></div></div><div id="reports"></div></div>
<div class="card"><div class="top"><h2>Messages</h2><button id="refreshMessages">Refresh</button></div><p class="muted small">Moderation access to stored public and private messages. Use only when necessary.</p><div id="messages"></div></div>
<div class="card"><div class="top"><h2>Admin audit log</h2><button id="refreshAudit">Refresh</button></div><div id="audit"></div></div>
<script>
const token=localStorage.getItem('token');const $=id=>document.getElementById(id);const statusEl=$('status');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function api(path,options={}){const headers={...(options.headers||{}),Authorization:`Bearer ${token}`};const r=await fetch(path,{...options,headers,cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function showError(e){statusEl.className='card error';statusEl.textContent=e.message}
async function init(){if(!token){location.href='/';return}try{const me=await api('/api/me');if(me.user.role!=='admin')throw new Error('Admin access required.');statusEl.className='card ok';statusEl.textContent='Signed in as @'+me.user.username;await Promise.all([loadStats(),loadUsers(),loadReports(),loadMessages(),loadAudit()])}catch(e){showError(e);setTimeout(()=>location.href='/',1200)}}
async function loadStats(){try{const s=await api('/api/admin/stats');$('stats').innerHTML=[['Users',s.totalUsers],['Posts',s.totalPosts],['Messages',s.totalMessages],['Banned',s.bannedUsers],['Open reports',s.openReports],['Active admins',s.adminCount],['Live sockets',s.activeSockets]].map(x=>`<div class="stat"><div class="muted small">${esc(x[0])}</div><strong>${esc(x[1])}</strong></div>`).join('')}catch(e){$('stats').innerHTML=`<span class="error">${esc(e.message)}</span>`}}
async function loadUsers(){try{const q=$('userSearch').value.trim();const d=await api('/api/admin/users?limit=50'+(q?'&q='+encodeURIComponent(q):''));$('users').innerHTML=d.users.map(x=>{const owner=x.username===d.ownerUsername;return `<div class="item"><strong>@${esc(x.username)}</strong> <span class="muted">${esc(x.email)}</span><div class="small muted">${esc(x.role)} · ${x.isBanned?'banned':'active'} · ${x.emailVerified?'email verified':'email unverified'}${owner?' · protected owner':''}</div><div class="actions">${owner?'':'<button data-role="'+esc(x.username)+'" data-value="'+(x.role==='admin'?'user':'admin')+'">'+(x.role==='admin'?'Remove admin':'Make admin')+'</button><button class="danger" data-ban="'+esc(x.username)+'" data-value="'+(!x.isBanned)+'">'+(x.isBanned?'Unban':'Ban')+'</button><button class="danger" data-del="'+esc(x.username)+'">Delete</button>'}</div></div>`}).join('')||'<p class="muted">No users found.</p>'}catch(e){$('users').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
async function loadReports(){try{const d=await api('/api/admin/reports?status='+encodeURIComponent($('reportStatus').value)+'&limit=50');$('reports').innerHTML=d.reports.map(r=>`<div class="item"><strong>${esc(r.targetType)}</strong> <code>${esc(r.targetId)}</code><div>${esc(r.reason)}</div><div class="muted small">reported by @${esc(r.reporter)} · ${new Date(r.createdAt).toLocaleString()} · ${esc(r.status)}</div><div class="actions">${r.status==='open'?'<button data-report-status="resolved" data-report-id="'+esc(r._id)+'">Resolve</button><button class="danger" data-report-status="dismissed" data-report-id="'+esc(r._id)+'">Dismiss</button>':''}</div></div>`).join('')||'<p class="muted">No reports in this status.</p>'}catch(e){$('reports').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
async function loadMessages(){try{const d=await api('/api/admin/messages?limit=50');$('messages').innerHTML=d.messages.map(m=>`<div class="item"><strong>@${esc(m.sender)}</strong>${m.recipient?` <span class="muted">→ @${esc(m.recipient)}</span>`:' <span class="muted">→ public</span>'}<div>${esc(m.text)}</div><div class="muted small">${new Date(m.createdAt).toLocaleString()}</div><div class="actions"><button class="danger" data-message-del="${esc(m._id)}">Delete message</button></div></div>`).join('')||'<p class="muted">No messages.</p>'}catch(e){$('messages').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
async function loadAudit(){try{const d=await api('/api/admin/audit-log?limit=50');$('audit').innerHTML=d.entries.map(x=>`<div class="item"><strong>${esc(x.action)}</strong> · @${esc(x.actor)}${x.target?' · '+esc(x.target):''}<div class="muted small">${new Date(x.createdAt).toLocaleString()}</div>${x.details?`<div>${esc(x.details)}</div>`:''}</div>`).join('')||'<p class="muted">No admin actions recorded yet.</p>'}catch(e){$('audit').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
$('send').onclick=async()=>{const message=$('broadcast').value.trim();if(!message)return;try{await api('/api/admin/broadcast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});$('broadcast').value='';alert('Broadcast sent.')}catch(e){alert(e.message)}};
$('refreshUsers').onclick=loadUsers;$('searchUsers').onclick=loadUsers;$('userSearch').onkeydown=e=>{if(e.key==='Enter')loadUsers()};$('refreshReports').onclick=loadReports;$('reportStatus').onchange=loadReports;$('refreshMessages').onclick=loadMessages;$('refreshAudit').onclick=loadAudit;
$('users').onclick=async e=>{try{const role=e.target.closest('[data-role]'),ban=e.target.closest('[data-ban]'),del=e.target.closest('[data-del]');if(role)await api('/api/admin/users/role',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:role.dataset.role,role:role.dataset.value})});if(ban)await api('/api/admin/users/ban',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:ban.dataset.ban,isBanned:ban.dataset.value==='true'})});if(del&&confirm('Delete this user and their associated content? This cannot be undone.'))await api('/api/admin/users/'+encodeURIComponent(del.dataset.del),{method:'DELETE'});await Promise.all([loadStats(),loadUsers(),loadAudit()])}catch(x){alert(x.message)}};
$('reports').onclick=async e=>{const b=e.target.closest('[data-report-status]');if(!b)return;try{await api('/api/admin/reports/'+encodeURIComponent(b.dataset.reportId),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:b.dataset.reportStatus})});await Promise.all([loadStats(),loadReports(),loadAudit()])}catch(x){alert(x.message)}};
$('messages').onclick=async e=>{const b=e.target.closest('[data-message-del]');if(!b)return;if(!confirm('Delete this stored message?'))return;try{await api('/api/admin/messages/'+encodeURIComponent(b.dataset.messageDel),{method:'DELETE'});await Promise.all([loadStats(),loadMessages(),loadAudit()])}catch(x){alert(x.message)}};
init();
</script></body></html>
